version: '3.8'

services:
  ocr-service:
    build: .
    container_name: ocr_service
    ports:
      - "8000:8000"
    volumes:
      - /tmp/ocr:/tmp/ocr
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
