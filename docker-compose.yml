services:
  # Database
  db:
    image: postgres:16-alpine
    container_name: morapi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: morapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Laravel API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: morapi_api
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./apps/api/.env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./apps/api:/var/www
      - /var/www/vendor

  # Laravel Queue Worker
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: morapi_worker
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./apps/api/.env
    environment:
      DB_HOST: db
    command: php artisan queue:work --tries=3
    volumes:
      - ./apps/api:/var/www
      - /var/www/vendor

  # AI Service (OCR + Whisper)
  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: morapi_ai
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ./apps/ai/.env
    volumes:
      - ./apps/ai:/app
      - /tmp/ai:/tmp/ai
      - ai_models:/app/.models
    deploy:
      resources:
        limits:
          memory: 8G

  # Frontend React
  frontend:
    build:
      context: ./apps/personal
      dockerfile: Dockerfile
    container_name: morapi_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  ai_models:
