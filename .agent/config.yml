agent:
  name: "Vista Mora Agent"
  version: "1.1.0"
  description: "AI Agent untuk pengembangan ekosistem Vista & Mora Financial Network"
  language: "id"
  model: "gemini-2.0-flash"

project:
  name: "Vista & Mora Financial Network (MVP)"
  architecture: "Monolithic API (Laravel 13) + Multi-page HTML/SCSS/TS (Tabler UI)"
  repository: "visatamora"

paths:
  backend: "api/"
  frontend: "apps/"
  worksheet: "worksheet/"
  prompts: ".agent/prompts/"
  tools: ".agent/tools/"
  memory: ".agent/memory/"
  schemas: ".agent/schemas/"
  evals: ".agent/evals/"

apps:
  vista:
    type: "HR Dashboard (B2B)"
    path: "apps/vista/"
    platform: "Web + Desktop (Capacitor)"
  mora:
    type: "Personal Finance (B2C)"
    path: "apps/mora/"
    platform: "Web + Mobile (Capacitor)"
  api:
    type: "Laravel 13 Monolithic API"
    path: "api/"
    pattern: "MVC + Service + Repository"
  core:
    type: "Shared JS/TS modules"
    path: "apps/core/"
  shared:
    type: "Reusable HTML components"
    path: "apps/shared/"

tech_stack:
  backend: "Laravel 13, PHP 8.2+, Eloquent ORM"
  frontend: "Tabler UI, SCSS, TypeScript, Vite"
  database: "PostgreSQL 16"
  cache_queue: "Redis 7, Supervisor"
  cloud: "Hetzner Cloud CX22"
  storage: "Cloudflare R2"
  auth: "Laravel Sanctum"
  ai: "Google Gemini 2.0 Flash"
  cross_platform: "Capacitor"

constraints:
  - "Jangan gunakan React, Vue, Next.js, atau framework SPA"
  - "Jangan gunakan Tailwind CSS"
  - "Jangan gunakan auto-increment ID, selalu ULID"
  - "Jangan buat arsitektur microservice"
  - "Jangan taruh business logic di Controller atau Model"
  - "Jangan proses berat secara synchronous, gunakan Job Queue"
  - "API tanpa versioning prefix (/v1)"
