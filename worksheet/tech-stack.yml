meta:
  project: "Vista & Mora Financial Network (MVP)"
  version: "1.2.0"
  date: "2026-04"
  architecture: "Monolithic API (Laravel 13) + React/Vite Frontend (Tabler React)"

infrastructure:
  provider: "Hetzner Cloud"
  plan: "CX22 — 2 vCPU, 4GB RAM, 40GB SSD"
  os: "Ubuntu 22.04 LTS"
  region: "ap-southeast (Singapore)"
  web_server: "Nginx 1.24"
  ssl: "Let's Encrypt (Certbot)"
  firewall:
    - "Allow 80/443 from anywhere"
    - "Allow 22 from trusted IP only"

backend:
  framework: "Laravel 13"
  runtime: "PHP 8.2+"
  database: "PostgreSQL 16 (localhost)"
  orm: "Eloquent ORM"
  cache: "Redis 7 (localhost)"
  queue:
    driver: "Redis"
    manager: "Supervisor"
    workers: 2
    tries: 3
    max_time: 3600

frontend:
  framework: "Tabler React"
  styling: "SCSS/Bootstrap"
  javascript: "React 19 + TypeScript"
  build_tool: "Vite 7"
  structure:
    tabler: "Tabler Core (Bootstrap 5.3 + Sass)"
    core: "API Client & logic di apps/core"
    vista: "HR Dashboard (React components)"
    mora: "Personal Finance PWA (React components)"
  pwa:
    scope: "/mora"
    manifest: "mora/public/manifest.json"
    service_worker: "mora/public/sw.js"


ai_system:
  provider: "Google Gemini"
  model: "gemini-2.0-flash"
  usage:
    - "Transaction categorization"
    - "Financial insights"
    - "HR document processing"
  wrapper: "app/AI/AIService.php"
  deferred:
    - "Groq (post-MVP)"
    - "Ollama self-hosted (post-MVP)"

third_party:
  email:
    provider: "Resend"
    free_tier: "3,000 email/bulan"
    usage: ["Notifikasi transaksi", "OTP", "Laporan bulanan"]

  whatsapp:
    provider: "Meta WhatsApp Cloud API"
    phase_1: "Email only (saat launch)"
    phase_2: "WhatsApp aktif setelah approval (~2-4 minggu)"

  payment:
    provider: "Tripay QRIS"
    webhook: "POST /api/webhooks/tripay"

  storage:
    provider: "Cloudflare R2 (S3-compatible)"
    usage: ["Dokumen HR", "Foto struk", "Export PDF", "Backup DB"]

monitoring:
  error_tracking:
    provider: "Sentry"
    plan: "Free (5,000 errors/bulan)"
    package: "sentry/sentry-laravel"

  uptime:
    provider: "UptimeRobot"
    plan: "Free (interval 5 menit)"
    monitors:
      - "https://api.vistaora.com/health"
      - "https://vistaora.com"

  debug:
    provider: "Laravel Telescope"
    environment: "local only"

  logs:
    driver: "daily"
    retention: "14 days"

backup:
  database:
    tool: "pg_dump → gzip → rclone → Cloudflare R2"
    schedule: "Setiap hari 02:00"
    retention: "30 hari"
    destination: "r2://bucket/backups/db/"
  files:
    note: "File user sudah di R2, built-in redundancy"
  restore_test: "Manual, setiap 2 minggu"

supervisor:
  config: "/etc/supervisor/conf.d/laravel-worker.conf"
  command: "php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=128"
  numprocs: 2
  user: "www-data"
  autorestart: true

deployment:
  strategy: "Manual SSH (MVP)"
  steps:
    - "git pull origin main"
    - "composer install --no-dev --optimize-autoloader"
    - "php artisan migrate --force"
    - "php artisan config:cache && route:cache && view:cache"
    - "php artisan queue:restart"
    - "supervisorctl restart laravel-worker:*"
  env_required:
    - "APP_KEY"
    - "DB_DATABASE, DB_USERNAME, DB_PASSWORD"
    - "REDIS_HOST"
    - "GEMINI_API_KEY"
    - "RESEND_API_KEY"
    - "TRIPAY_API_KEY, TRIPAY_PRIVATE_KEY"
    - "CLOUDFLARE_R2_ACCESS_KEY, SECRET, BUCKET, ENDPOINT"
    - "SENTRY_LARAVEL_DSN"

cost_estimate:
  hetzner_cx22: "$5.00/bulan"
  cloudflare_r2: "$0.00 (free tier)"
  resend: "$0.00 (free tier)"
  sentry: "$0.00 (free tier)"
  uptimerobot: "$0.00 (free tier)"
  gemini_api: "~$1.00-5.00/bulan"
  tripay: "0.7% per transaksi"
  total_fixed: "~$6.00-10.00/bulan"

post_mvp:
  phase_2:
    - "Aktifkan WhatsApp API"
    - "Tambah Groq jika Gemini terlalu lambat"
    - "Migrasi ke Laravel Horizon"
    - "Setup GitHub Actions CI/CD"
  phase_3:
    - "Managed PostgreSQL"
    - "Cloudflare CDN"
    - "Pisah worker server"
  scaling_triggers:
    cpu: "> 70% sustained → upgrade VPS"
    memory: "> 80% sustained → upgrade VPS"
    queue: "> 1000 jobs pending → tambah worker"