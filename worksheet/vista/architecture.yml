meta:
  app: "Vista"
  type: "B2B Dashboard"
  url: "https://vista.vistamora.id"
  port_frontend: 3000
  port_api: 4000
  rendering: "App Router + React Server Components"
  users: ["Owner", "Admin", "HR", "Staff (view only)"]


request_flow:
  browser_to_server:
    1: "User buka vista.vistamora.id"
    2: "Nginx → proxy ke Tabler React :3000"
    3: "Tabler React App Router — RSC render di server"
    4: "RSC fetch data langsung ke Laravel API :4000 (server-to-server, cepat)"
    5: "Client component fetch via React Query (cache, refetch, optimistic)"
    6: "Nginx → proxy /api/* ke Laravel :4000"


frontend:
  framework: "Tabler React"
  React: "^19.0.0"
  rendering: "App Router + React Server Components"
  bundle_target: "Desktop browser (Chrome, Firefox, Safari)"
  docker:
    image: "ghcr.io/${REPO}/vista:${TAG}"
    port: 3000
    memory: "512MB"
    cpu: "0.5 OCPU"
    node_options: "--max-old-space-size=400"

  pages:
    auth:
      - route: "/login"
        component: "LoginPage"
        type: "Client"
        desc: "Form login email/password + Google OAuth"
      - route: "/register"
        component: "RegisterPage"
        type: "Client"
        desc: "Daftar akun baru + buat workspace"

    dashboard:
      - route: "/dashboard"
        component: "DashboardPage"
        type: "RSC"
        desc: "Overview: ringkasan karyawan, payroll bulan ini, invoice outstanding, cash flow"
        data_fetched:
          - "Total karyawan aktif"
          - "Total pengeluaran gaji bulan ini"
          - "Invoice belum dibayar"
          - "Grafik cash flow 6 bulan"

    employee_management:
      - route: "/employees"
        component: "EmployeeListPage"
        type: "RSC + Client Table"
        desc: "Tabel karyawan dengan filter, search, export CSV"
        features:
          - "TanStack Table: sort, filter, pagination"
          - "Virtual scroll untuk 1000+ karyawan"
          - "Bulk actions: aktifkan, nonaktifkan, export"
          - "Status badge: aktif, kontrak, tidak aktif"

      - route: "/employees/new"
        component: "NewEmployeePage"
        type: "Client"
        desc: "Form tambah karyawan baru"
        features:
          - "React Hook Form + Zod validation"
          - "Upload foto KTP, NPWP, dokumen kontrak"
          - "Auto-invite ke Mora via email"

      - route: "/employees/:id"
        component: "EmployeeDetailPage"
        type: "RSC"
        desc: "Detail lengkap: profil, dokumen, riwayat gaji, absensi, cuti"
        tabs:
          - "Profil & Dokumen"
          - "Riwayat Payroll"
          - "Kehadiran"
          - "Cuti & Izin"
          - "Kasbon"

    payroll:
      - route: "/payroll"
        component: "PayrollListPage"
        type: "RSC"
        desc: "Daftar semua payroll run per bulan"

      - route: "/payroll/run"
        component: "RunPayrollPage"
        type: "Client"
        desc: "Jalankan payroll bulan berjalan"
        features:
          - "Progress bar real-time via WebSocket"
          - "Preview kalkulasi sebelum approve"
          - "Breakdown: gaji pokok, tunjangan, BPJS, PPh21, kasbon"

      - route: "/payroll/:runId"
        component: "PayrollDetailPage"
        type: "RSC"
        desc: "Detail run: list slip gaji semua karyawan"
        features:
          - "Filter by departemen"
          - "Download slip gaji PDF per karyawan"
          - "Export rekap Excel"
          - "Approve & kirim slip"

    attendance:
      - route: "/attendance"
        component: "AttendancePage"
        type: "RSC + Client"
        desc: "Rekap kehadiran + live map check-in karyawan"
        features:
          - "Live map Leaflet: titik check-in karyawan hari ini"
          - "WebSocket push: update real-time saat karyawan check-in"
          - "Filter: harian, mingguan, bulanan"
          - "Status: hadir, terlambat, absen, WFH"

      - route: "/attendance/shifts"
        component: "ShiftSchedulerPage"
        type: "Client"
        desc: "Drag-and-drop jadwal shift karyawan"
        features:
          - "@dnd-kit drag-and-drop"
          - "Grid mingguan per departemen"
          - "Assign shift ke karyawan / grup"
          - "Emit event: shift.scheduled → notif Mora"

    leave:
      - route: "/leave"
        component: "LeaveManagementPage"
        type: "RSC + Client"
        desc: "Approve/reject pengajuan cuti karyawan"
        features:
          - "Tab: Pending, Disetujui, Ditolak"
          - "Filter by departemen, periode"
          - "SSE notif saat ada pengajuan baru masuk"
          - "Approve/reject → emit leave.resolved → update Mora"

    kasbon:
      - route: "/kasbon"
        component: "KasbonPage"
        type: "RSC + Client"
        desc: "Manajemen kasbon/pinjaman karyawan"
        features:
          - "List pengajuan kasbon pending"
          - "Approve/reject dengan catatan"
          - "Otomatis potong dari payroll bulan depan"
          - "SSE notif saat kasbon baru masuk"

    invoices:
      - route: "/invoices"
        component: "InvoiceListPage"
        type: "RSC"
        desc: "Daftar invoice ke klien"
        features:
          - "Filter: draft, sent, paid, overdue"
          - "SSE notif: invoice.paid"

      - route: "/invoices/new"
        component: "NewInvoicePage"
        type: "Client"
        desc: "Buat invoice baru"
        features:
          - "Form klien + line items"
          - "Preview PDF sebelum kirim"
          - "Auto-generate nomor invoice"

      - route: "/invoices/:id"
        component: "InvoiceDetailPage"
        type: "RSC"
        desc: "Detail invoice + status pembayaran"
        features:
          - "Download PDF invoice"
          - "Kirim reminder ke klien via WA/email"
          - "Rekam pembayaran manual"
          - "Link QRIS Tripay untuk bayar online"

    reports:
      - route: "/reports"
        component: "ReportsPage"
        type: "RSC + Client"
        desc: "Laporan keuangan bisnis"
        sub_reports:
          - "P&L (Laba Rugi) bulanan/tahunan"
          - "Cash Flow statement"
          - "Rekap penggajian per periode"
          - "SPT PPh 21 (export Excel)"
        features:
          - "Recharts: Line, Bar, Area chart"
          - "DateRangePicker filter periode"
          - "Export Excel via xlsx"
          - "Export PDF via @React-pdf/renderer"

    settings:
      - route: "/settings"
        component: "SettingsPage"
        type: "Client"
        desc: "Pengaturan workspace"
        tabs:
          - "Profil Perusahaan"
          - "Anggota & Role"
          - "Integrasi (WA, Email)"
          - "Paket Langganan"
          - "Notifikasi"

  layout:
    root_layout:
      file: "app/layout.tsx"
      includes: ["Providers (QueryClient, Theme)", "Toaster (Sonner)", "PostHog", "GlitchTip"]

    dashboard_layout:
      file: "app/(dashboard)/layout.tsx"
      includes:
        sidebar:
          type: "Fixed sidebar — desktop"
          items:
            - { label: "Dashboard",   icon: "LayoutDashboard", route: "/dashboard" }
            - { label: "Karyawan",    icon: "Users",           route: "/employees" }
            - { label: "Payroll",     icon: "Banknote",        route: "/payroll" }
            - { label: "Kehadiran",   icon: "MapPin",          route: "/attendance" }
            - { label: "Cuti & Izin", icon: "CalendarOff",     route: "/leave" }
            - { label: "Kasbon",      icon: "CreditCard",      route: "/kasbon" }
            - { label: "Invoice",     icon: "FileText",        route: "/invoices" }
            - { label: "Laporan",     icon: "BarChart2",       route: "/reports" }
            - { label: "Pengaturan",  icon: "Settings",        route: "/settings" }
        topbar:
          includes: ["Workspace switcher", "Command palette Cmd+K", "Notifikasi bell", "Avatar menu"]
          command_palette:
            package: "cmdk"
            shortcuts:
              - "Cmd+K → buka palette"
              - "Ketik nama karyawan → langsung ke profil"
              - "Ketik 'payroll' → run payroll"
              - "Ketik 'invoice baru' → buat invoice"

  state:
    server_state:
      package: "@tanstack/React-query"
      version: "^5.0.0"
      usage:
        - "Cache data karyawan, payroll, invoice — tidak re-fetch tiap navigasi"
        - "Invalidate cache setelah mutation (tambah karyawan, approve payroll)"
        - "Background refetch setiap 5 menit untuk data dashboard"
      stale_times:
        employees:   300000   # 5 menit
        payroll_run: 0        # selalu fresh
        dashboard:   60000    # 1 menit
        reports:     600000   # 10 menit

    client_state:
      package: "zustand"
      version: "^4.5.0"
      stores:
        ui_store:
          fields: ["sidebarOpen", "activeWorkspaceId", "commandPaletteOpen"]
        notification_store:
          fields: ["notifications[]", "unreadCount", "sseConnected"]

  realtime:
    sse:
      client: "native EventSource (0 KB)"
      url: "GET /api/notifications/stream"
      events_received:
        - { event: "kasbon.requested",  action: "Toast notif + badge counter +1" }
        - { event: "leave.submitted",   action: "Toast notif + badge counter +1" }
        - { event: "invoice.paid",      action: "Toast notif + invalidate invoice query" }
        - { event: "payroll.processed", action: "Toast sukses setelah approve" }

    websocket:
      client: "native WebSocket (0 KB)"
      url: "WSS /api/ws"
      events_received:
        - { event: "payroll_progress",  action: "Update progress bar run payroll" }
        - { event: "attendance_checkin", action: "Add marker di Leaflet live map" }

  ui_stack:
    component_library: "tabler/ui (copy-paste, zero runtime)"
    styling: "Tailwind CSS v4"
    icons: "lucide-React (tree-shakeable)"
    theme: "Light/dark mode via next-themes"
    charts: "Recharts (Line, Bar, Area, Pie, Composed)"
    table: "@tanstack/React-table + @tanstack/React-virtual"
    map: "Leaflet + React-leaflet (gratis, no billing)"
    dnd: "@dnd-kit (shift scheduler)"
    date: "React-day-picker"
    toast: "sonner"
    command: "cmdk (Cmd+K palette)"
    drawer: "vaul (bottom sheet)"

  packages:
    vista_only:
      - { pkg: "leaflet",          ver: "^1.9.0",   why: "Live map presensi — gratis selamanya" }
      - { pkg: "React-leaflet",    ver: "^4.2.1" }
      - { pkg: "@dnd-kit/core",    ver: "^6.1.0",   why: "Drag-drop shift scheduler" }
      - { pkg: "@dnd-kit/sortable", ver: "^8.0.0" }
      - { pkg: "@dnd-kit/utilities", ver: "^3.2.0" }
      - { pkg: "cmdk",             ver: "^1.0.0",   why: "Command palette Cmd+K" }
      - { pkg: "xlsx",             ver: "^0.18.5",  why: "Export Excel payroll, SPT" }

    shared_with_mora:
      - { pkg: "@tanstack/React-query", ver: "^5.0.0" }
      - { pkg: "zustand",               ver: "^4.5.0" }
      - { pkg: "React-hook-form",       ver: "^7.52.0" }
      - { pkg: "@hookform/resolvers",   ver: "^3.0.0" }
      - { pkg: "zod",                   ver: "^3.22.0" }
      - { pkg: "recharts",              ver: "^2.12.0" }
      - { pkg: "@tanstack/React-table", ver: "^8.17.0" }
      - { pkg: "tailwindcss",           ver: "^4.0.0" }
      - { pkg: "lucide-React",          ver: "^0.400.0" }
      - { pkg: "sonner",                ver: "^1.5.0" }
      - { pkg: "next-themes",           ver: "^0.3.0" }
      - { pkg: "date-fns",              ver: "^3.6.0" }
      - { pkg: "date-fns-tz",           ver: "^3.1.0" }


backend_modules_used:

  auth_module:
    endpoints:
      - "POST /api/auth/login"
      - "POST /api/auth/register"
      - "GET  /api/auth/google"
      - "POST /api/auth/refresh"
      - "POST /api/auth/logout"
    notes: "Sanctum + Google OAuth. Refresh token di httpOnly cookie."

  workspace_module:
    endpoints:
      - "GET    /api/workspaces/:id"
      - "PATCH  /api/workspaces/:id"
      - "GET    /api/workspaces/:id/members"
      - "POST   /api/workspaces/:id/members"
      - "DELETE /api/workspaces/:id/members/:userId"
    notes: "Multi-workspace support. Role: owner, admin, hr, staff."

  employees_module:
    endpoints:
      - "GET    /api/employees"
      - "POST   /api/employees"
      - "GET    /api/employees/:id"
      - "PATCH  /api/employees/:id"
      - "DELETE /api/employees/:id"
      - "POST   /api/employees/:id/documents"
      - "GET    /api/employees/:id/documents"
    middleware: ["auth:sanctum", "RolesGuard(admin,hr,owner)"]

  payroll_module:
    endpoints:
      - "GET  /api/payroll/runs"
      - "POST /api/payroll/runs"
      - "GET  /api/payroll/runs/:id/progress  (SSE)"
      - "GET  /api/payroll/runs/:id/items"
      - "POST /api/payroll/runs/:id/approve"
    notes: "Run payroll async via Laravel Horizon. Progress via WebSocket."

  attendance_module:
    endpoints:
      - "GET /api/attendance"
      - "GET /api/attendance/live"
      - "GET /api/attendance/shifts"
      - "POST /api/attendance/shifts"
      - "PATCH /api/attendance/shifts/:id"
    notes: "Live map data via WebSocket push."

  leave_module:
    endpoints:
      - "GET   /api/leave/requests"
      - "PATCH /api/leave/requests/:id/approve"
      - "PATCH /api/leave/requests/:id/reject"
    notes: "Approve/reject → emit leave.resolved → Mora update saldo cuti."

  kasbon_module:
    endpoints:
      - "GET   /api/kasbon/requests"
      - "PATCH /api/kasbon/requests/:id/approve"
      - "PATCH /api/kasbon/requests/:id/reject"
    notes: "Kasbon approved → otomatis potong dari payroll run berikutnya."

  invoice_module:
    endpoints:
      - "GET    /api/invoices"
      - "POST   /api/invoices"
      - "GET    /api/invoices/:id"
      - "PATCH  /api/invoices/:id"
      - "DELETE /api/invoices/:id"
      - "POST   /api/invoices/:id/send"
      - "POST   /api/invoices/:id/payment"
      - "GET    /api/invoices/:id/pdf"
    notes: "PDF via @React-pdf/renderer. Payment via Tripay QRIS."

  report_module:
    endpoints:
      - "GET /api/reports/pl"
      - "GET /api/reports/cashflow"
      - "GET /api/reports/payroll-summary"
      - "GET /api/reports/pph21"
    notes: "Data berat → cache Redis 10 menit. Export Excel/PDF via Laravel Horizon."

  notification_module:
    endpoints:
      - "GET /api/notifications/stream (SSE)"
      - "GET /api/notifications"
      - "PATCH /api/notifications/:id/read"


middleware:
  global:
    - name: "auth:sanctum"
      desc: "Semua route /dashboard/* dilindungi Sanctum"
      skip: ["/login", "/register", "/api/auth/*"]

    - name: "RolesGuard"
      desc: "Cek role user untuk aksi sensitif"
      usage:
        - "Hanya owner yang bisa approve payroll"
        - "Hanya admin/hr yang bisa tambah karyawan"
        - "Staff hanya bisa view"

    - name: "WorkspaceContextMiddleware"
      desc: "Inject workspaceId aktif ke setiap request dari header X-Workspace-Id"

    - name: "LoggingInterceptor"
      desc: "Log semua request: method, url, userId, duration"

    - name: "TransformInterceptor"
      desc: "Wrap semua response dalam { success, data, timestamp }"

    - name: "HttpExceptionFilter"
      desc: "Format error response konsisten"

  rate_limiting:
    login:    { max: 5,  window: "15 menit", reason: "Anti brute force" }
    api:      { max: 100, window: "1 menit",  reason: "General API protection" }
    export:   { max: 10,  window: "1 menit",  reason: "Cegah abuse export besar" }


database_tables:
  primary:
    - users
    - profiles
    - workspaces
    - workspace_members
    - employees
    - documents
    - attendance
    - shifts
    - leave_balances
    - leave_requests
    - kasbon_requests
    - payroll_runs
    - payroll_items
    - invoices
    - invoice_items
    - clients
    - notifications
    - subscriptions
    - ai_usage_logs

  read_from_mora_context:
    - wallets          # saldo karyawan (dibaca untuk info kasbon)
    - transactions     # ringkasan transaksi (context laporan)


events:
  emitted_by_vista:
    - event: "payroll.processed"
      trigger: "Owner approve payroll run"
      received_by: "Mora — catat income karyawan + alokasi goals"

    - event: "kasbon.approved"
      trigger: "HR approve kasbon"
      received_by: "Mora — notif karyawan + catat hutang"

    - event: "kasbon.rejected"
      trigger: "HR reject kasbon"
      received_by: "Mora — notif karyawan"

    - event: "leave.resolved"
      trigger: "HR approve/reject cuti"
      received_by: "Mora — update saldo cuti karyawan"

    - event: "shift.scheduled"
      trigger: "HR update jadwal shift"
      received_by: "Mora — reminder jadwal masuk karyawan"

    - event: "attendance.checked_in"
      trigger: "Karyawan check-in via Mora"
      received_by: "Vista — update live map Leaflet"

  received_by_vista:
    - event: "leave.submitted"
      from: "Mora"
      action: "SSE notif ke HR + badge counter"

    - event: "kasbon.requested"
      from: "Mora"
      action: "SSE notif ke HR + badge counter"


Laravel Horizon_jobs:
  payroll_queue:
    concurrency: 2
    jobs:
      process_payroll_run:
        trigger: "POST /api/payroll/runs"
        steps:
          - "Fetch semua karyawan aktif workspace"
          - "Kalkulasi gaji pokok + tunjangan + lembur"
          - "Hitung potongan BPJS Kesehatan (1%) + BPJS TK (2%)"
          - "Hitung PPh 21 progresif"
          - "Potong kasbon aktif"
          - "Simpan PayrollItem per karyawan"
          - "Push progress via Redis pub/sub → WebSocket"
          - "Update status PayrollRun: completed"

  payslip_queue:
    concurrency: 5
    jobs:
      generate_payslip:
        trigger: "payroll.approved event"
        steps:
          - "Generate PDF slip gaji via @React-pdf/renderer"
          - "Upload ke Cloudflare R2"
          - "Kirim email ke karyawan via DigitalOcean Email + Brevo"
          - "Emit SSE notif ke Mora karyawan"

  report_queue:
    concurrency: 3
    jobs:
      generate_report:
        trigger: "GET /api/reports/* dengan export=true"
        steps:
          - "Query data agregat dari PostgreSQL"
          - "Generate Excel via xlsx atau PDF via @React-pdf/renderer"
          - "Upload ke Cloudflare R2"
          - "Kirim pre-signed URL ke user"

  email_queue:
    concurrency: 10
    jobs:
      send_invoice_reminder:
        trigger: "Cron 08:00 harian — cek invoice overdue"
        steps:
          - "Query invoice status: sent, due_date < today"
          - "Kirim reminder email via DigitalOcean Email"
          - "Kirim WA via Meta Cloud API jika nomor tersedia"


scheduler:
  jobs:
    - cron: "0 8 * * *"
      job: "Cek invoice overdue → kirim reminder email + WA"

    - cron: "0 8 * * *"
      job: "Cek dokumen karyawan expired H-30, H-7 → notif HR"

    - cron: "0 9 1 * *"
      job: "THR alert H-30 sebelum lebaran → notif owner"

    - cron: "0 20 * * *"
      job: "Daily reminder absensi untuk karyawan via Mora SSE"


monitoring:
  error_tracking:
    service: "GlitchTip self-hosted"
    package: "@sentry/nextjs"
    dsn: "${GLITCHTIP_DSN}"
    note: "SDK Sentry-compatible, hanya DSN berbeda"

  analytics:
    service: "PostHog Cloud"
    package: "posthog-js"
    events_tracked:
      - "pageview semua halaman"
      - "payroll_run_started"
      - "invoice_created"
      - "employee_added"
      - "report_exported"
      - "feature_used (command_palette, filters, export)"

  DigitalOcean:
    - "DigitalOcean Monitoring: CPU, RAM, Disk, Network container Vista"
    - "DigitalOcean Logging: access log Nginx + app log pino"
    - "DigitalOcean Notifications: alert jika container down"


environment_variables:
  NEXT_PUBLIC_API_URL: "http://vistamora.test"
  NEXT_PUBLIC_WS_URL: "ws://vistamora.test"
  NEXT_PUBLIC_POSTHOG_KEY: "<from-posthog.com>"
  NEXT_PUBLIC_POSTHOG_HOST: "https://app.posthog.com"
  NEXT_PUBLIC_SENTRY_DSN: "${GLITCHTIP_DSN}"
  NEXT_PUBLIC_APP_NAME: "Vista"
  NEXT_PUBLIC_MORA_URL: "https://mora.vistamora.id"


docker:
  dockerfile: "apps/vista/Dockerfile"
  strategy: "Multi-stage build"
  stages:
    deps:
      base: "node:20-alpine"
      runs: "npm install --frozen-lockfile"
    builder:
      base: "node:20-alpine"
      runs: "npm turbo build --filter=vista"
      output: ".next/standalone"
    runner:
      base: "node:20-alpine"
      arch: "linux/arm64 (VPS Server)"
      copies: ".next/standalone, .next/static, public"
      cmd: "node server.js"
  final_image_size: "~120 MB"
  port: 3000
  healthcheck: "GET /api/health → HTTP 200"