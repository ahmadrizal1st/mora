conventions:
  base_url: "http://vistamora.test"
  auth_header: "Authorization: Bearer <access_token>"
  content_type: "Content-Type: application/json"
  multipart: "Content-Type: multipart/form-data"
  workspace_header: "X-Workspace-ID: <workspace_id>  # wajib di semua endpoint Vista"
  rate_limit_headers:
    - "X-RateLimit-Limit: 100"
    - "X-RateLimit-Remaining: 97"
    - "X-RateLimit-Reset: 1709820000"
  ai_headers:
    - "X-AI-Token-Used: 3"
    - "X-AI-Token-Limit: 50"
    - "X-AI-Token-Reset: 2026-03-07T00:00:00+07:00"
  pagination:
    query_params: "?page=1&limit=20&sort=created_at&order=desc"
    response_envelope: |
      {
        "data": [...],
        "meta": { "page": 1, "limit": 20, "total": 150, "total_pages": 8 }
      }
  error_envelope: |
    {
      "statusCode": 400,
      "error": "BAD_REQUEST",
      "message": "Deskripsi error",
      "details": { ... }
    }


api:

  auth:
    prefix: /auth
    guards: []

    endpoints:
      - method: POST
        path: /auth/register
        desc: "Daftar akun baru dengan email & password"
        body:
          name: string
          email: string
          password: string  # min 8 chars
          role: "owner | employee"
        response: "201 { user_id, email, message: 'OTP dikirim ke email' }"

      - method: POST
        path: /auth/verify-otp
        desc: "Verifikasi OTP 6 digit setelah register"
        body:
          email: string
          otp: string  # 6 digit
        response: "200 { access_token, user }"

      - method: POST
        path: /auth/login
        desc: "Login email & password"
        rate_limit: "10 req/menit per IP"
        body:
          email: string
          password: string
        response: "200 { access_token, user }"
        cookies_set: "refresh_token (httpOnly, 7d)"

      - method: POST
        path: /auth/refresh
        desc: "Perbarui access token via refresh token cookie"
        cookies_required: "refresh_token"
        body: ~
        response: "200 { access_token }"

      - method: POST
        path: /auth/logout
        guard: "[Sanctum]"
        desc: "Logout — hapus refresh token cookie & Redis session"
        body: ~
        response: "200 { message: 'Logged out' }"
        cookies_cleared: "refresh_token"

      - method: POST
        path: /auth/forgot-password
        desc: "Kirim OTP reset password ke email"
        rate_limit: "5 req/menit per IP"
        body:
          email: string
        response: "200 { message: 'OTP reset dikirim' }"

      - method: POST
        path: /auth/reset-password
        desc: "Reset password dengan OTP"
        body:
          email: string
          otp: string
          new_password: string
        response: "200 { message: 'Password berhasil diubah' }"

      - method: POST
        path: /auth/resend-otp
        desc: "Kirim ulang OTP verifikasi"
        rate_limit: "3 req/menit per IP"
        body:
          email: string
          type: "register | reset_password"
        response: "200 { message: 'OTP dikirim ulang' }"

      - method: GET
        path: /auth/google
        desc: "Redirect ke Google OAuth consent screen"
        response: "302 redirect ke Google"

      - method: GET
        path: /auth/google/callback
        desc: "Callback dari Google OAuth"
        query:
          code: string
          state: string
        response: "302 redirect ke FE dengan access_token"

      - method: GET
        path: /auth/me
        guard: "[Sanctum]"
        desc: "Ambil profil user yang sedang login"
        response: "200 { user: { id, name, email, avatar, plan, workspaces[] } }"

      - method: PATCH
        path: /auth/me
        guard: "[Sanctum]"
        desc: "Update profil (nama, avatar)"
        body:
          name: string?
          avatar_url: string?
        response: "200 { user }"

      - method: PATCH
        path: /auth/me/password
        guard: "[Sanctum]"
        desc: "Ubah password (login biasa)"
        body:
          current_password: string
          new_password: string
        response: "200 { message: 'Password diubah' }"

  workspace:
    prefix: /workspaces
    guards: "[Sanctum]"

    endpoints:
      - method: GET
        path: /workspaces
        desc: "Daftar workspace milik / yang diikuti user"
        response: "200 { data: workspace[] }"

      - method: POST
        path: /workspaces
        desc: "Buat workspace baru"
        body:
          name: string
          industry: string?
          logo_url: string?
        response: "201 { workspace }"

      - method: GET
        path: /workspaces/:id
        desc: "Detail workspace"
        response: "200 { workspace, members[], subscription }"

      - method: PATCH
        path: /workspaces/:id
        roles: "[owner, admin]"
        desc: "Update info workspace"
        body:
          name: string?
          logo_url: string?
          address: string?
          industry: string?
        response: "200 { workspace }"

      - method: DELETE
        path: /workspaces/:id
        roles: "[owner]"
        desc: "Hapus workspace (soft delete)"
        response: "200 { message: 'Workspace dihapus' }"

      - method: GET
        path: /workspaces/:id/members
        headers: "X-Workspace-ID"
        desc: "Daftar anggota workspace"
        query:
          page: int?
          limit: int?
          role: "owner|admin|hr|employee?"
        response: "200 { data: member[], meta }"

      - method: POST
        path: /workspaces/:id/invite
        roles: "[owner, admin, hr]"
        desc: "Undang anggota via email (generate magic link)"
        body:
          email: string
          role: "admin | hr | employee"
        response: "201 { invite_token, expires_at }"

      - method: POST
        path: /workspaces/join/:token
        desc: "Bergabung workspace via invite token"
        response: "200 { workspace, member }"

      - method: DELETE
        path: /workspaces/:id/members/:user_id
        roles: "[owner, admin]"
        desc: "Keluarkan anggota dari workspace"
        response: "200 { message: 'Anggota dikeluarkan' }"

      - method: PATCH
        path: /workspaces/:id/members/:user_id/role
        roles: "[owner]"
        desc: "Ubah role anggota"
        body:
          role: "admin | hr | employee"
        response: "200 { member }"

  employees:
    prefix: /employees
    guards: "[Sanctum]"
    headers_required: "X-Workspace-ID"

    endpoints:
      - method: GET
        path: /employees
        desc: "Daftar karyawan dalam workspace"
        query:
          page: int?
          limit: int?
          search: string?
          department: string?
          status: "active|inactive|all?"
          sort: "name|joined_at|salary?"
          order: "asc|desc?"
        response: "200 { data: employee[], meta }"

      - method: POST
        path: /employees
        roles: "[owner, admin, hr]"
        desc: "Tambah karyawan baru"
        body:
          name: string
          nik: string
          email: string
          phone: string
          position: string
          department: string
          join_date: date
          salary_base: number
          bpjs_kesehatan: boolean
          bpjs_ketenagakerjaan: boolean
          bank_name: string
          bank_account: string
          umk_region: string
        response: "201 { employee }"

      - method: GET
        path: /employees/:id
        desc: "Detail karyawan"
        response: "200 { employee, documents[], attendance_summary, leave_balance }"

      - method: PATCH
        path: /employees/:id
        roles: "[owner, admin, hr]"
        desc: "Update data karyawan"
        body: "partial Employee"
        response: "200 { employee }"

      - method: DELETE
        path: /employees/:id
        roles: "[owner, admin]"
        desc: "Nonaktifkan karyawan (soft delete)"
        body:
          termination_date: date
          reason: string
        response: "200 { message }"

      - method: GET
        path: /employees/:id/documents
        desc: "Daftar dokumen karyawan"
        query:
          type: "ktp|npwp|bpjs|ijazah|kontrak|all?"
          status: "active|expired|expiring_soon?"
        response: "200 { documents[] }"

      - method: POST
        path: /employees/:id/documents
        roles: "[owner, admin, hr]"
        desc: "Upload dokumen karyawan"
        content_type: "multipart/form-data"
        body:
          file: File  # max 5MB, pdf/jpg/png
          type: "ktp|npwp|bpjs|ijazah|kontrak"
          expiry_date: date?
          notes: string?
        response: "201 { document }"

      - method: DELETE
        path: /employees/:id/documents/:doc_id
        roles: "[owner, admin, hr]"
        desc: "Hapus dokumen"
        response: "200 { message }"

      - method: GET
        path: /employees/export
        roles: "[owner, admin, hr]"
        desc: "Export data karyawan ke Excel"
        query:
          format: "xlsx"
          department: string?
          status: "active|all?"
        response: "200 File (xlsx)"
        headers_response: "Content-Disposition: attachment; filename=employees.xlsx"

  attendance:
    prefix: /attendance
    guards: "[Sanctum]"
    headers_required: "X-Workspace-ID"

    endpoints:
      - method: POST
        path: /attendance/check-in
        desc: "Check-in karyawan (selfie + lokasi)"
        content_type: "multipart/form-data"
        body:
          selfie: File  # jpg/png, max 2MB
          latitude: float
          longitude: float
          device_info: string?
        response: "201 { attendance, selfie_url }"

      - method: POST
        path: /attendance/check-out
        desc: "Check-out karyawan"
        body:
          latitude: float
          longitude: float
        response: "200 { attendance }"

      - method: GET
        path: /attendance
        desc: "Riwayat absensi"
        query:
          employee_id: string?
          date_from: date?
          date_to: date?
          page: int?
          limit: int?
        response: "200 { data: attendance[], meta }"

      - method: GET
        path: /attendance/live-map
        desc: "Posisi check-in semua karyawan hari ini (untuk live map Leaflet)"
        query:
          date: date?
        response: "200 { locations: [{ employee_id, name, lat, lng, checked_in_at }] }"

      - method: GET
        path: /attendance/summary/:employee_id
        desc: "Rekap absensi karyawan per bulan"
        query:
          month: "YYYY-MM"
        response: "200 { total_hadir, total_absen, total_terlambat, total_lembur }"

  shifts:
    prefix: /shifts
    guards: "[Sanctum]"
    headers_required: "X-Workspace-ID"

    endpoints:
      - method: GET
        path: /shifts
        desc: "Daftar shift / jadwal kerja"
        query:
          week: "YYYY-WW?"
          employee_id: string?
          department: string?
        response: "200 { shifts[] }"

      - method: POST
        path: /shifts
        roles: "[owner, admin, hr]"
        desc: "Buat shift baru"
        body:
          employee_id: string
          date: date
          start_time: "HH:mm"
          end_time: "HH:mm"
          notes: string?
        response: "201 { shift }"

      - method: PATCH
        path: /shifts/:id
        roles: "[owner, admin, hr]"
        desc: "Update shift (drag-drop menggunakan ini)"
        body:
          date: date?
          start_time: string?
          end_time: string?
          employee_id: string?
        response: "200 { shift }"

      - method: DELETE
        path: /shifts/:id
        roles: "[owner, admin, hr]"
        desc: "Hapus shift"
        response: "200 { message }"

      - method: POST
        path: /shifts/bulk
        roles: "[owner, admin, hr]"
        desc: "Buat banyak shift sekaligus (copy mingguan)"
        body:
          shifts: shift[]
        response: "201 { created: int, shifts[] }"

  leave:
    prefix: /leave
    guards: "[Sanctum]"
    headers_required: "X-Workspace-ID"

    endpoints:
      - method: GET
        path: /leave/balance/:employee_id
        desc: "Saldo cuti karyawan"
        response: "200 { annual: { total, used, remaining }, sick: { ... }, ... }"

      - method: GET
        path: /leave/requests
        desc: "Daftar pengajuan cuti"
        query:
          employee_id: string?
          status: "pending|approved|rejected|all?"
          date_from: date?
          date_to: date?
          page: int?
          limit: int?
        response: "200 { data: leave_request[], meta }"

      - method: POST
        path: /leave/requests
        desc: "Ajukan cuti"
        body:
          type: "annual|sick|maternity|paternity|other"
          start_date: date
          end_date: date
          reason: string
          attachment_url: string?
        response: "201 { leave_request }"

      - method: PATCH
        path: /leave/requests/:id/approve
        roles: "[owner, admin, hr]"
        desc: "Setujui pengajuan cuti"
        body:
          notes: string?
        response: "200 { leave_request }"
        event_emitted: "leave.resolved → notif karyawan + update saldo Mora"

      - method: PATCH
        path: /leave/requests/:id/reject
        roles: "[owner, admin, hr]"
        desc: "Tolak pengajuan cuti"
        body:
          reason: string
        response: "200 { leave_request }"
        event_emitted: "leave.resolved → notif karyawan"

  payroll:
    prefix: /payroll
    guards: "[Sanctum]"
    headers_required: "X-Workspace-ID"

    endpoints:
      - method: GET
        path: /payroll/runs
        desc: "Daftar riwayat run payroll"
        query:
          month: "YYYY-MM?"
          status: "draft|processing|done|failed?"
          page: int?
          limit: int?
        response: "200 { data: payroll_run[], meta }"

      - method: POST
        path: /payroll/runs
        roles: "[owner, admin]"
        desc: "Inisiasi run payroll (async via Laravel Horizon)"
        body:
          period_month: "YYYY-MM"
          include_thr: boolean?
          notes: string?
        response: "202 { job_id, message: 'Payroll sedang diproses' }"
        realtime: "WebSocket ws://vistamora.test → event: payroll:progress"

      - method: GET
        path: /payroll/runs/:id
        desc: "Detail hasil run payroll"
        response: "200 { payroll_run, items[], summary }"

      - method: GET
        path: /payroll/runs/:id/items
        desc: "Detail gaji per karyawan dalam 1 run"
        query:
          page: int?
          limit: int?
          search: string?
        response: "200 { data: payroll_item[], meta }"

      - method: GET
        path: /payroll/runs/:id/export
        roles: "[owner, admin]"
        desc: "Export Excel payroll run"
        query:
          format: "xlsx"
        response: "200 File (xlsx)"

      - method: POST
        path: /payroll/runs/:id/send-payslips
        roles: "[owner, admin]"
        desc: "Kirim slip gaji ke semua karyawan (via email + bridge ke Mora)"
        response: "202 { job_id, message: 'Slip gaji sedang dikirim' }"
        event_emitted: "payroll.processed → Mora income + notif"

      - method: GET
        path: /payroll/payslip/:employee_id/:period
        desc: "Ambil slip gaji PDF karyawan tertentu"
        params:
          employee_id: string
          period: "YYYY-MM"
        response: "200 { pdf_url }  # pre-signed DigitalOcean URL"

      - method: GET
        path: /payroll/payslip/:employee_id/:period/download
        desc: "Download slip gaji PDF langsung"
        response: "200 File (pdf)"

  kasbon:
    prefix: /kasbon
    guards: "[Sanctum]"

    endpoints:
      - method: GET
        path: /kasbon
        desc: "Daftar kasbon (HR: semua, Karyawan: milik sendiri)"
        headers: "X-Workspace-ID (Vista) atau tidak perlu (Mora)"
        query:
          status: "pending|approved|rejected|active|settled?"
          page: int?
          limit: int?
        response: "200 { data: kasbon[], meta }"

      - method: POST
        path: /kasbon
        desc: "Ajukan kasbon (dari Mora atau Vista)"
        body:
          amount: number
          reason: string
          installments: int
          workspace_id: string
        response: "201 { kasbon }"
        event_emitted: "kasbon.requested → notif HR Vista"

      - method: PATCH
        path: /kasbon/:id/approve
        roles: "[owner, admin, hr]"
        headers: "X-Workspace-ID"
        desc: "Setujui kasbon"
        body:
          approved_amount: number?
          notes: string?
        response: "200 { kasbon }"
        event_emitted: "kasbon.approved → notif karyawan + potong payroll otomatis"

      - method: PATCH
        path: /kasbon/:id/reject
        roles: "[owner, admin, hr]"
        headers: "X-Workspace-ID"
        desc: "Tolak kasbon"
        body:
          reason: string
        response: "200 { kasbon }"

  invoices:
    prefix: /invoices
    guards: "[Sanctum]"
    headers_required: "X-Workspace-ID"

    endpoints:
      - method: GET
        path: /invoices
        desc: "Daftar invoice"
        query:
          status: "draft|sent|paid|overdue|cancelled?"
          client_id: string?
          date_from: date?
          date_to: date?
          page: int?
          limit: int?
          search: string?
        response: "200 { data: invoice[], meta }"

      - method: POST
        path: /invoices
        desc: "Buat invoice baru"
        body:
          client_id: string
          issue_date: date
          due_date: date
          items:
            - description: string
              qty: number
              unit_price: number
              tax_percent: number?
          notes: string?
          payment_terms: string?
        response: "201 { invoice }"

      - method: GET
        path: /invoices/:id
        desc: "Detail invoice"
        response: "200 { invoice, items[], client, payment_history[] }"

      - method: PATCH
        path: /invoices/:id
        desc: "Update invoice (hanya status draft)"
        body: "partial Invoice"
        response: "200 { invoice }"

      - method: DELETE
        path: /invoices/:id
        desc: "Hapus invoice (hanya draft)"
        response: "200 { message }"

      - method: POST
        path: /invoices/:id/send
        desc: "Kirim invoice ke klien via email"
        body:
          custom_message: string?
          cc: string[]?
        response: "200 { message: 'Invoice dikirim' }"

      - method: POST
        path: /invoices/:id/mark-paid
        roles: "[owner, admin]"
        desc: "Tandai invoice lunas (manual)"
        body:
          paid_date: date
          payment_method: string
          notes: string?
        response: "200 { invoice }"

      - method: GET
        path: /invoices/:id/pdf
        desc: "Download PDF invoice"
        response: "200 File (pdf)"

      - method: POST
        path: /invoices/:id/follow-up
        desc: "Kirim email follow-up overdue (AI adaptive tone)"
        body:
          tone: "polite|firm|final?"
        response: "200 { message: 'Follow-up dikirim', tone_used: string }"
        ai_used: "Gemini — adaptive tone generation"

      - method: GET
        path: /invoices/report/pl
        desc: "Laporan P&L — download PDF"
        query:
          date_from: date
          date_to: date
          format: "pdf|xlsx?"
        response: "200 File (pdf/xlsx)"

  clients:
    prefix: /clients
    guards: "[Sanctum]"
    headers_required: "X-Workspace-ID"

    endpoints:
      - method: GET
        path: /clients
        desc: "Daftar klien"
        query:
          search: string?
          page: int?
          limit: int?
        response: "200 { data: client[], meta }"

      - method: POST
        path: /clients
        desc: "Tambah klien baru"
        body:
          name: string
          email: string
          phone: string?
          address: string?
          company: string?
          npwp: string?
        response: "201 { client }"

      - method: GET
        path: /clients/:id
        desc: "Detail klien"
        response: "200 { client, invoices[], total_billed, total_paid }"

      - method: PATCH
        path: /clients/:id
        desc: "Update klien"
        body: "partial Client"
        response: "200 { client }"

      - method: DELETE
        path: /clients/:id
        desc: "Hapus klien (soft delete)"
        response: "200 { message }"

  transactions:
    prefix: /transactions
    guards: "[Sanctum]"

    endpoints:
      - method: GET
        path: /transactions
        desc: "Riwayat transaksi user"
        query:
          wallet_id: string?
          category: string?
          type: "income|expense|transfer?"
          date_from: date?
          date_to: date?
          search: string?
          page: int?
          limit: int?
          sort: "date|amount?"
          order: "asc|desc?"
        response: "200 { data: transaction[], meta, summary: { total_income, total_expense } }"

      - method: POST
        path: /transactions
        desc: "Catat transaksi manual"
        body:
          wallet_id: string
          type: "income|expense|transfer"
          amount: number
          description: string
          category_id: string
          date: date
          notes: string?
          receipt_id: string?
          to_wallet_id: string?
        response: "201 { transaction }"
        ai_optional: "POST /ai/categorize dipanggil terlebih dahulu jika category_id kosong"

      - method: GET
        path: /transactions/:id
        desc: "Detail transaksi"
        response: "200 { transaction, receipt? }"

      - method: PATCH
        path: /transactions/:id
        desc: "Edit transaksi"
        body:
          amount: number?
          description: string?
          category_id: string?
          date: date?
          notes: string?
        response: "200 { transaction }"

      - method: DELETE
        path: /transactions/:id
        desc: "Hapus transaksi"
        response: "200 { message }"

      - method: GET
        path: /transactions/export
        desc: "Export transaksi Excel"
        query:
          date_from: date
          date_to: date
          format: "xlsx"
          wallet_id: string?
        response: "200 File (xlsx)"

  wallets:
    prefix: /wallets
    guards: "[Sanctum]"

    endpoints:
      - method: GET
        path: /wallets
        desc: "Daftar wallet user"
        response: "200 { wallets[], total_balance }"

      - method: POST
        path: /wallets
        desc: "Buat wallet baru"
        body:
          name: string
          type: "cash|bank|e-wallet|investment"
          initial_balance: number?
          color: string?
          icon: string?
        response: "201 { wallet }"

      - method: GET
        path: /wallets/:id
        desc: "Detail wallet + ringkasan bulan ini"
        response: "200 { wallet, balance, monthly_summary }"

      - method: PATCH
        path: /wallets/:id
        desc: "Update wallet"
        body: "partial Wallet"
        response: "200 { wallet }"

      - method: DELETE
        path: /wallets/:id
        desc: "Hapus wallet (hanya jika balance 0)"
        response: "200 { message }"

  budgets:
    prefix: /budgets
    guards: "[Sanctum]"

    endpoints:
      - method: GET
        path: /budgets
        desc: "Daftar anggaran bulan ini"
        query:
          month: "YYYY-MM?"
        response: "200 { budgets[], total_budget, total_spent, over_budget_count }"

      - method: POST
        path: /budgets
        desc: "Buat anggaran per kategori"
        body:
          category_id: string
          month: "YYYY-MM"
          amount: number
        response: "201 { budget }"

      - method: PATCH
        path: /budgets/:id
        desc: "Update anggaran"
        body:
          amount: number
        response: "200 { budget }"

      - method: DELETE
        path: /budgets/:id
        desc: "Hapus anggaran"
        response: "200 { message }"

  categories:
    prefix: /categories
    guards: "[Sanctum]"

    endpoints:
      - method: GET
        path: /categories
        desc: "Daftar kategori transaksi"
        query:
          type: "income|expense|all?"
        response: "200 { categories[] }"

      - method: POST
        path: /categories
        desc: "Buat kategori custom"
        body:
          name: string
          type: "income|expense"
          icon: string?
          color: string?
        response: "201 { category }"

      - method: PATCH
        path: /categories/:id
        desc: "Update kategori"
        body: "partial Category"
        response: "200 { category }"

      - method: DELETE
        path: /categories/:id
        desc: "Hapus kategori custom"
        response: "200 { message }"

  goals:
    prefix: /goals
    guards: "[Sanctum]"

    endpoints:
      - method: GET
        path: /goals
        desc: "Daftar goal tabungan"
        response: "200 { goals[], total_saved, total_target }"

      - method: POST
        path: /goals
        desc: "Buat goal baru"
        body:
          name: string
          target_amount: number
          target_date: date?
          icon: string?
          color: string?
        response: "201 { goal }"

      - method: GET
        path: /goals/:id
        desc: "Detail goal + pockets + riwayat alokasi"
        response: "200 { goal, pockets[], allocations[], progress_percent }"

      - method: PATCH
        path: /goals/:id
        desc: "Update goal"
        body: "partial Goal"
        response: "200 { goal }"

      - method: DELETE
        path: /goals/:id
        desc: "Hapus goal"
        response: "200 { message }"

      - method: POST
        path: /goals/:id/allocate
        desc: "Alokasi dana ke goal (dari wallet)"
        body:
          wallet_id: string
          amount: number
          pocket_id: string?
          notes: string?
        response: "200 { allocation, goal_progress }"

      - method: POST
        path: /goals/:id/pockets
        desc: "Tambah pocket ke goal"
        body:
          name: string
          target_amount: number?
        response: "201 { pocket }"

      - method: DELETE
        path: /goals/:id/pockets/:pocket_id
        desc: "Hapus pocket"
        response: "200 { message }"

  debts:
    prefix: /debts
    guards: "[Sanctum]"

    endpoints:
      - method: GET
        path: /debts
        desc: "Daftar utang"
        query:
          type: "owe|owed?"
          status: "active|settled|all?"
        response: "200 { debts[], total_owe, total_owed }"

      - method: POST
        path: /debts
        desc: "Catat utang baru"
        body:
          type: "owe|owed"
          creditor_name: string
          amount: number
          due_date: date?
          interest_rate: float?
          notes: string?
        response: "201 { debt }"

      - method: GET
        path: /debts/:id
        desc: "Detail utang + riwayat pembayaran"
        response: "200 { debt, payments[] }"

      - method: POST
        path: /debts/:id/payments
        desc: "Catat pembayaran cicilan"
        body:
          amount: number
          date: date
          notes: string?
        response: "201 { payment, remaining_balance }"

      - method: DELETE
        path: /debts/:id
        desc: "Hapus catatan utang"
        response: "200 { message }"

  subscriptions:
    prefix: /subscriptions
    guards: "[Sanctum]"

    endpoints:
      - method: GET
        path: /subscriptions
        desc: "Daftar langganan bulanan"
        response: "200 { subscriptions[], total_monthly_cost }"

      - method: POST
        path: /subscriptions
        desc: "Catat langganan baru"
        body:
          name: string
          amount: number
          billing_cycle: "monthly|yearly|weekly"
          billing_date: int  # tanggal dalam bulan (1-31)
          category_id: string?
          notes: string?
        response: "201 { subscription }"

      - method: PATCH
        path: /subscriptions/:id
        desc: "Update langganan"
        body: "partial Subscription"
        response: "200 { subscription }"

      - method: DELETE
        path: /subscriptions/:id
        desc: "Hapus langganan"
        response: "200 { message }"

  patungan:
    prefix: /split
    guards: "[Sanctum]"

    endpoints:
      - method: GET
        path: /split/groups
        desc: "Daftar grup patungan saya"
        response: "200 { groups[], active_bills_count, total_owe, total_owed }"

      - method: POST
        path: /split/groups
        desc: "Buat grup patungan baru"
        body:
          name: string
          description: string?
          photo_url: string?
        response: "201 { group, invite_link }"

      - method: GET
        path: /split/groups/:id
        desc: "Detail grup + daftar tagihan + settlement summary"
        response: "200 { group, members[], bills[], settlement: { simplify_debts[] } }"

      - method: PATCH
        path: /split/groups/:id
        desc: "Update info grup"
        body:
          name: string?
          description: string?
          photo_url: string?
        response: "200 { group }"

      - method: DELETE
        path: /split/groups/:id
        desc: "Hapus grup (hanya jika semua settle)"
        response: "200 { message }"

      - method: POST
        path: /split/groups/join/:invite_code
        desc: "Bergabung ke grup via invite link"
        response: "200 { group, member }"

      - method: GET
        path: /split/groups/:id/members
        desc: "Daftar anggota grup"
        response: "200 { members[] }"

      - method: DELETE
        path: /split/groups/:id/members/:user_id
        desc: "Keluarkan anggota / keluar dari grup sendiri"
        response: "200 { message }"

      - method: GET
        path: /split/groups/:id/bills
        desc: "Daftar tagihan dalam grup"
        query:
          status: "open|settled|all?"
          page: int?
          limit: int?
        response: "200 { data: bills[], meta }"

      - method: POST
        path: /split/groups/:id/bills
        desc: "Buat tagihan baru dalam grup"
        body:
          description: string
          total: number
          split_mode: "equal|custom|percentage|item_based"
          receipt_id: string?
          assignments:
            - user_id: string
              amount: number?
              percentage: float?
              item_ids: string[]?
        response: "201 { bill, assignments[] }"
        event_emitted: "split.bill_created → notif SSE semua anggota"

      - method: GET
        path: /split/bills/:bill_id
        desc: "Detail tagihan + status per anggota"
        response: "200 { bill, items[], assignments[] }"

      - method: DELETE
        path: /split/bills/:bill_id
        desc: "Hapus tagihan (hanya pembuat, belum ada yang bayar)"
        response: "200 { message }"

      - method: POST
        path: /split/bills/:bill_id/pay
        desc: "Konfirmasi bayar porsi saya (manual / via Tripay)"
        body:
          amount: number
          payment_method: "manual|qris|va"
          notes: string?
        response: "200 { assignment, payment_url? }"
        event_emitted: "split.paid → catat transaksi kedua pihak Mora"

      - method: POST
        path: /split/bills/:bill_id/confirm-paid/:user_id
        desc: "Pembayar konfirmasi bahwa anggota sudah transfer (manual)"
        body:
          notes: string?
        response: "200 { assignment }"

      - method: GET
        path: /split/groups/:id/settlement
        desc: "Kalkulasi simplify debts dalam grup"
        response: "200 { debts: [{ from_user, to_user, amount }] }"

  receipts:
    prefix: /receipts
    guards: "[Sanctum]"

    endpoints:
      - method: POST
        path: /receipts/scan
        desc: "Upload foto nota → crop + OCR + AI → return draft transaksi"
        content_type: "multipart/form-data"
        body:
          file: File  # jpg/png, max 10MB
          context: "personal|expense|split?"
          workspace_id: string?
        response: |
          202 {
            receipt_id: string,
            status: "processing",
            job_id: string,
            poll_url: "/receipts/:id/status"
          }
        note: "Proses async via Laravel Horizon. Client poll status atau dengar SSE"
        sse_event: "receipt:done → { receipt_id, draft_transaction, confidence_score }"

      - method: GET
        path: /receipts/:id/status
        desc: "Cek status proses scan nota"
        response: |
          200 {
            status: "processing|done|failed",
            receipt?: { id, clean_image_url, merchant, date, items[], total, category, confidence_score },
            draft_transaction?: { ... }
          }

      - method: GET
        path: /receipts/:id
        desc: "Ambil nota bersih (pre-signed URL dari DigitalOcean)"
        response: "200 { receipt, image_url, items[] }"

      - method: GET
        path: /receipts/:id/items
        desc: "Daftar item OCR dari nota (untuk split item-based)"
        response: "200 { items: [{ id, description, amount }] }"

      - method: POST
        path: /receipts/:id/confirm
        desc: "Konfirmasi draft → simpan jadi transaksi"
        body:
          wallet_id: string
          amount: number
          description: string
          category_id: string
          date: date
          notes: string?
          split_group_id: string?
        response: "201 { transaction, receipt }"

      - method: DELETE
        path: /receipts/:id
        desc: "Tolak / buang draft nota (hapus dari DigitalOcean)"
        response: "200 { message }"

  ai:
    prefix: /ai
    guards: "[Sanctum]"
    rate_limit_headers: "[X-AI-Token-Used, X-AI-Token-Limit, X-AI-Token-Reset]"
    note: "Semua endpoint ini consume AI token bucket. 429 jika limit harian tercapai."

    endpoints:
      - method: POST
        path: /ai/categorize
        desc: "Auto-kategorisasi 1 transaksi (Groq, cache 30 hari)"
        body:
          description: string
          amount: number?
        response: "200 { category_id, category_name, confidence: float, from_cache: boolean }"
        ai_headers: true

      - method: POST
        path: /ai/chat
        desc: "AI Financial Advisor chat (Gemini, streaming)"
        body:
          messages: [{ role: "user|assistant", content: string }]
          context:
            balance: number?
            recent_transactions: transaction[]?
        response: "200 text/event-stream (SSE streaming)"
        ai_headers: true

      - method: GET
        path: /ai/persona
        desc: "Ambil spending persona user (Gemini + Groq, cache 30 hari)"
        response: "200 { persona_type, traits[], advice[], share_card_url, from_cache }"
        ai_headers: true

      - method: POST
        path: /ai/forecast
        desc: "Cash flow forecast 30/60/90 hari (Gemini, cache 1 jam)"
        body:
          period_days: 30 | 60 | 90
        response: "200 { forecast: [{ date, predicted_income, predicted_expense, balance }], narrative, from_cache }"
        ai_headers: true

      - method: GET
        path: /ai/anomaly
        desc: "Deteksi anomali spending bulan ini (Gemini)"
        response: "200 { anomalies: [{ category, usual_amount, current_amount, diff_percent, alert }], overall_health: 'good|warning|alert' }"
        ai_headers: true

      - method: POST
        path: /ai/goals/recommend
        desc: "Rekomendasi alokasi dana ke goals (Groq)"
        body:
          available_amount: number
          goals: [{ id, name, target, current, target_date }]
        response: "200 { recommendations: [{ goal_id, suggested_amount, reason }] }"
        ai_headers: true

      - method: POST
        path: /ai/debts/recommend
        desc: "Rekomendasi strategi bayar utang (Groq)"
        body:
          debts: [{ id, name, balance, interest_rate, min_payment }]
          extra_budget: number
        response: "200 { strategy: 'avalanche|snowball', payment_plan: [{ debt_id, monthly_payment, months_to_paid }], total_interest_saved }"
        ai_headers: true

      - method: POST
        path: /ai/subscriptions/score
        desc: "Worth-it score langganan (Groq)"
        body:
          subscriptions: [{ id, name, amount, last_used_at, frequency_used }]
        response: "200 { scores: [{ subscription_id, score: 0-10, verdict, reason }] }"
        ai_headers: true

      - method: GET
        path: /ai/insight/monthly
        desc: "Monthly insight report (Ollama batch, biasanya sudah ada di cache)"
        query:
          month: "YYYY-MM?"
        response: "200 { insight, key_points[], from_cache }"
        ai_headers: true

      - method: GET
        path: /ai/token-usage
        desc: "Cek sisa AI token hari ini (tanpa consume token)"
        response: "200 { used, limit, remaining, reset_at, plan }"

  notifications:
    prefix: /notifications
    guards: "[Sanctum]"

    endpoints:
      - method: GET
        path: /notifications/stream
        desc: "SSE stream untuk notifikasi real-time"
        headers:
          Accept: "text/event-stream"
          Cache-Control: "no-cache"
        response: "text/event-stream → event: notification → data: { type, title, body, metadata, created_at }"
        events:
          - "payroll_received   — gaji masuk dari Vista"
          - "kasbon_updated     — kasbon approved/rejected"
          - "leave_resolved     — cuti disetujui/ditolak"
          - "shift_updated      — jadwal shift berubah"
          - "invoice_paid       — invoice klien lunas (Vista)"
          - "split_bill_created — tagihan patungan baru"
          - "split_paid         — anggota bayar tagihan"
          - "receipt_done       — scan nota selesai diproses"
          - "budget_alert       — anggaran mendekati batas"

      - method: GET
        path: /notifications
        desc: "Riwayat notifikasi"
        query:
          is_read: "true|false?"
          page: int?
          limit: int?
        response: "200 { data: notification[], meta, unread_count }"

      - method: PATCH
        path: /notifications/:id/read
        desc: "Tandai notifikasi sudah dibaca"
        response: "200 { notification }"

      - method: PATCH
        path: /notifications/read-all
        desc: "Tandai semua notifikasi sudah dibaca"
        response: "200 { updated_count }"

      - method: POST
        path: /notifications/push/subscribe
        desc: "Daftarkan push subscription (PWA Mora)"
        body:
          endpoint: string
          keys:
            p256dh: string
            auth: string
        response: "201 { message: 'Push subscription berhasil' }"

      - method: DELETE
        path: /notifications/push/unsubscribe
        desc: "Hapus push subscription"
        body:
          endpoint: string
        response: "200 { message }"

  payments:
    prefix: /payments
    guards: "[Sanctum] kecuali webhook"

    endpoints:
      - method: POST
        path: /payments/create
        desc: "Buat transaksi pembayaran QRIS / VA via Tripay"
        body:
          reference_type: "subscription|split_bill|invoice"
          reference_id: string
          amount: number
          method: "QRIS|BCA_VA|BNI_VA|MANDIRI_VA"
          customer:
            name: string
            email: string
            phone: string?
        response: "201 { transaction_id, payment_url, qr_url?, va_number?, expired_at }"

      - method: POST
        path: /payments/webhook/tripay
        guard: "[]  # public — verifikasi via HMAC signature header"
        desc: "Webhook callback dari Tripay"
        headers:
          X-Callback-Signature: "HMAC-SHA256 dari Tripay"
        body: "Tripay payload"
        response: "200 { success: true }"
        note: "Verifikasi signature sebelum proses. Trigger event sesuai reference_type."

      - method: GET
        path: /payments/:transaction_id/status
        desc: "Cek status pembayaran"
        response: "200 { status: 'pending|paid|failed|expired', transaction }"

  reports:
    prefix: /reports
    guards: "[Sanctum]"
    headers_required: "X-Workspace-ID"

    endpoints:
      - method: GET
        path: /reports/payroll
        desc: "Export payroll Excel / PDF"
        query:
          period: "YYYY-MM"
          format: "xlsx|pdf"
        response: "200 File"

      - method: GET
        path: /reports/spt
        desc: "Export data SPT karyawan Excel"
        query:
          year: int
          format: "xlsx"
        response: "200 File"

      - method: GET
        path: /reports/attendance
        desc: "Rekap absensi Excel"
        query:
          month: "YYYY-MM"
          department: string?
          format: "xlsx"
        response: "200 File"

      - method: GET
        path: /reports/pl
        desc: "Laporan P&L PDF / Excel"
        query:
          date_from: date
          date_to: date
          format: "pdf|xlsx"
        response: "200 File"

  websocket:
    url: "ws://vistamora.test/ws"
    auth: "query param: ?token=<access_token>"

    events_server_to_client:
      payroll_progress:
        trigger: "Saat run payroll berjalan"
        payload: "{ job_id, status: 'calculating|generating_pdf|sending|done|failed', progress_percent, processed, total, current_employee? }"

      attendance_location:
        trigger: "Saat karyawan check-in"
        payload: "{ employee_id, name, avatar_url, lat, lng, checked_in_at }"

    events_client_to_server:
      subscribe_payroll:
        payload: "{ job_id: string }"
      subscribe_live_map:
        payload: "{ workspace_id: string }"