agent:
  meta:
    project: "workshop-vista-mora"
    apps:
    - name: "Vista"
      purpose: "Human Resource System Information Management"
      type: "Tabler React"
    - name: "Mora"
      purpose: "Personal Financial Management"
      type: "Tabler React PWA"
    - name: "API"
      purpose: "High-performance Shared Backend"
      type: "Laravel 13 API"
    entry_point: "agent/AGENTS.yml"
    note: "Baca AGENTS.yml sebelum file apapun. Kualitas ditentukan oleh kejelasan isi, bukan jumlah file."

  entry:
    file: "agent/AGENTS.yml"
    description: >
      File pertama yang dibaca agent sebelum mengerjakan apapun.
      Berisi prioritas membaca file, prinsip utama, dan kapan agent
      harus berhenti dan bertanya ke manusia.

  context:
    description: "Pemahaman domain bisnis, produk, dan sistem sebelum menulis kode."
    files:
      - file: "product-vision.yml"
        description: >
          Visi produk Vista & Mora — target user, problem statement,
          north star metric, roadmap 6 bulan.

      - file: "domain-glossary.yml"
        description: >
          Kamus istilah domain bisnis — definisi konsisten untuk entity,
          status, role yang dipakai di seluruh codebase.

      - file: "user-personas.yml"
        description: >
          Persona pengguna utama — nama, role, kebutuhan, pain point,
          contoh use case nyata.

      - file: "system-architecture-overview.yml"
        description: >
          Diagram arsitektur sistem keseluruhan — Vista + Mora + Backend
          + Third-party services + data flow antar komponen.

      - file: "api-contracts.yml"
        description: >
          Ringkasan endpoint kritis — base URL, auth method, rate limit,
          error code standar yang digunakan seluruh tim.

      - file: "error-catalog.yml"
        description: >
          Daftar semua error code yang sudah ada beserta artinya, HTTP status
          yang dipakai, pesan user-facing vs internal. Mencegah duplikasi
          dan inkonsistensi error code.

      - file: "external-dependencies-map.yml"
        description: >
          Peta semua service eksternal (payment gateway, email service,
          analytics, maps) — base URL, auth method, rate limit, SLA,
          dan kontak person jika service down.

      - file: "known-limitations.yml"
        description: >
          Batasan teknis yang sudah diketahui — browser support minimum,
          device minimum spec, API rate limits yang tidak bisa diubah.

      - file: "team-conventions.yml"
        description: >
          Konvensi spesifik tim yang tidak ada di standar umum —
          keputusan unik yang sudah disepakati bersama.

      - file: "lessons-learned.yml"
        description: >
          Catatan dari insiden dan retrospektif — bugs yang pernah terjadi,
          pola yang harus dihindari, keputusan yang disesali.

  rules:
    description: "Standar, konvensi, dan batasan yang wajib diikuti agent saat menulis kode."
    versioning:
      format: "Setiap file menyertakan header: version, last-updated, owner"
    files:
      - file: "architectural-patterns.yml"
        description: >
          Pola arsitektur MVC yang wajib diikuti untuk Tabler React (Vista/Mora)
          dan pola standard MVC / Repository untuk Laravel 13 API.

      - file: "avoid-circular-dependencies.yml"
        description: >
          Aturan arah import antar layer, cara deteksi dengan
          madge/dependency-cruiser, dan cara memperbaiki circular deps.

      - file: "code-completion-mastery.yml"
        description: >
          Standar kelengkapan kode — tidak boleh ada TODO stub, tipe eksplisit,
          semua state (loading/error/success) harus ditangani penuh.

      - file: "code-idioms-and-conventions.yml"
        description: >
          Konvensi penamaan file, variabel, komponen; idiom React dan
          Tabler React yang disetujui tim.

      - file: "code-organization-principles.yml"
        description: >
          Struktur folder detail Vista dan Mora; aturan satu fitur satu
          folder, barrel export, batas panjang file.

      - file: "command-execution-rules.yml"
        description: >
          Daftar perintah resmi (npm scripts),
          aturan keamanan eksekusi command, larangan destructive command.

      - file: "concurrency-and-threading.yml"
        description: >
          Aturan async/await, Promise.all, AbortController (Tabler React);
          Web Workers, Service Workers (Serwist) untuk Mora.

      - file: "concurrency-and-threading-advanced.yml"
        description: >
          Pola lanjutan — race condition prevention, mutex pattern,
          optimistic locking untuk concurrent user edits.

      - file: "configuration-management.yml"
        description: >
          Manajemen env vars per environment, feature flags,
          secrets management, validasi wajib saat startup.

      - file: "core-design-principles.yml"
        description: >
          SOLID, DRY, KISS, YAGNI; prinsip UI/UX Vista;
          prinsip offline-first dan battery efficiency Mora.

      - file: "data-serialization-and-validation.yml"
        description: >
          Zod untuk Vista & Mora;
          aturan date/time ISO 8601, monetary values sebagai integer, enum validation.

      - file: "dependency-management.yml"
        description: >
          Daftar package yang disetujui, aturan audit mingguan,
          evaluasi dependency baru, lisensi yang diizinkan (MIT/BSD/Apache).

      - file: "documentation-principles.yml"
        description: >
          Standar JSDoc/TSDoc, format ADR, isi README per feature folder,
          aturan inline comment (jelaskan why bukan what).

      - file: "error-handling-principles.yml"
        description: >
          Hierarki error class, Result/Either pattern, ErrorBoundary,
          retry dengan exponential backoff, pembedaan expected vs unexpected error.

      - file: "logging-and-observability.yml"
        description: >
          Log levels, pino logger pattern Vista & Mora, observability stack
          (GlitchTip/Sentry), daftar data yang boleh dan tidak boleh dilog.

      - file: "logging-and-observability-advanced.yml"
        description: >
          Distributed tracing, correlation ID, structured log format JSON,
          alert threshold dan on-call escalation rules.

      - file: "performance-optimization.yml"
        description: >
          Core Web Vitals targets, code splitting, virtualization (Vista);
          PWA caching strategy, asset optimization (Mora).

      - file: "project-structure.yml"
        description: >
          Struktur monorepo root lengkap dengan penjelasan tiap folder
          Vista dan Mora beserta aturan penempatan file.

      - file: "resources-and-memory-management.yml"
        description: >
          Aturan cleanup useEffect/useMemo, AbortController,
          memory budget per halaman Vista & Mora.

      - file: "rugged-software-construction.yml"
        description: >
          Defensive programming, circuit breaker pattern,
          resilience checklist 6 pertanyaan wajib, chaos testing approach.

      - file: "security-mandate.yml"
        description: >
          Non-negotiables keamanan — token storage, XSS prevention,
          certificate pinning Mora, incident response SLA.

      - file: "security-principles.yml"
        description: >
          Least privilege, defense in depth, OWASP Top 10 compliance,
          GDPR/PDPA data privacy rules.

      - file: "testing-strategy.yml"
        description: >
          Piramid testing 70/20/10, contoh unit/component/E2E test
          Vista & Mora, coverage gates yang membuat CI gagal.

      - file: "api-design-standards.yml"
        description: >
          Konvensi REST API — naming endpoint, HTTP method usage,
          response envelope format, pagination standard, versioning strategy.

      - file: "accessibility-standards.yml"
        description: >
          WCAG 2.1 AA compliance, ARIA roles, keyboard navigation,
          color contrast ratio minimum, screen reader testing checklist.

      - file: "state-management-rules.yml"
        description: >
          Kapan pakai local vs server vs global state, larangan duplikasi state,
          derived state pattern, aturan sinkronisasi antar store.

      - file: "database-query-rules.yml"
        description: >
          Query optimization rules, pencegahan N+1, index strategy,
          pagination cursor vs offset, soft delete convention.

      - file: "mobile-platform-guidelines.yml"
        description: >
          iOS HIG compliance, Material Design 3 rules, safe area handling,
          PWA display-standalone awareness, back gesture behavior.

      - file: "offline-sync-strategy.yml"
        description: >
          Conflict resolution (last-write-wins vs merge), optimistic update
          rollback, sync queue management, offline-first data flow.

      - file: "i18n-and-localization.yml"
        description: >
          Internasionalisasi wajib dari awal, format tanggal/mata uang per locale,
          RTL layout support, string extraction rules.

      - file: "animation-and-motion.yml"
        description: >
          Durasi animasi standar (150/300/500ms), easing curves,
          reduced motion media query, 60fps target rule.

      - file: "code-review-standards.yml"
        description: >
          Checklist wajib reviewer, batas waktu review 24 jam,
          aturan approve, pembedaan blocking vs non-blocking comment.

      - file: "branch-and-git-strategy.yml"
        description: >
          Git flow (main/develop/feature/hotfix), merge vs rebase policy,
          squash commit rules, tag versioning SemVer.

      - file: "environment-parity.yml"
        description: >
          Dev/staging/prod harus identik secara infrastruktur,
          larangan "works on my machine", Docker mandatory.

      - file: "feature-flag-lifecycle.yml"
        description: >
          Naming convention flag, batas umur flag (max 2 sprint),
          proses cleanup, rollout percentage strategy.

      - file: "monitoring-and-alerting.yml"
        description: >
          SLO/SLI definition, alert threshold, on-call rotation rules,
          runbook template per alert type.

      - file: "data-privacy-handling.yml"
        description: >
          PII classification (L1/L2/L3), aturan masking di log,
          retention policy, right-to-erasure implementation.

      - file: "third-party-integration.yml"
        description: >
          SDK evaluation checklist, wrapper pattern wajib (tidak boleh
          pakai third-party langsung di business layer), fallback strategy.

      - file: "ai-agent-behavior.yml"
        description: >
          Aturan khusus untuk agent itu sendiri — kapan boleh berasumsi vs
          harus bertanya, batas otonomi, cara handle ambiguitas,
          format response yang diharapkan.

      - file: "breaking-change-policy.yml"
        description: >
          Definisi breaking change, proses deprecation dengan notice period,
          migration guide wajib, versioning API, komunikasi ke pengguna.

      - file: "rollback-and-recovery.yml"
        description: >
          Kapan harus rollback vs hotfix, prosedur recovery database,
          backup strategy, runbook template untuk keputusan teknis darurat.

  skills:
    description: "Kemampuan spesifik yang bisa dipanggil agent untuk mengerjakan task berulang."
    files:
      - file: "generate-component.yml"
        description: >
          Skill membuat komponen React baru lengkap dengan props,
          state, loading/error/empty state, dan file test-nya.

      - file: "generate-api-integration.yml"
        description: >
          Skill mengintegrasikan endpoint baru — schema Zod,
          API function (fetch), React Query hook.

      - file: "generate-feature-scaffold.yml"
        description: >
          Skill membuat scaffold satu fitur penuh — folder structure dan
          boilerplate files sesuai arsitektur yang ditetapkan.

      - file: "generate-design-system-component.yml"
        description: >
          Skill membuat komponen design system — variants, sizes,
          states (hover/focus/disabled), dark mode, Storybook story.

      - file: "generate-data-model.yml"
        description: >
          Skill membuat entity/model lengkap — Zod schema + TypeScript type
          Vista & Mora.

      - file: "generate-repository-layer.yml"
        description: >
          Skill scaffold repository interface + implementasi + mock
          untuk testing, terutama untuk Mora Clean Architecture.

      - file: "generate-form.yml"
        description: >
          Skill membuat form dengan validasi, error display, loading state,
          submit handling, dan aksesibilitas penuh.

      - file: "write-unit-tests.yml"
        description: >
          Skill menulis unit test dari kode yang ada — mendeteksi edge case,
          mock dependencies, laporan coverage.

      - file: "write-integration-tests.yml"
        description: >
          Skill menulis integration test — MSW mock server (Vista & Mora).

      - file: "write-e2e-tests.yml"
        description: >
          Skill menulis E2E test Playwright (Vista & Mora) dari acceptance criteria.

      - file: "refactor-code.yml"
        description: >
          Skill refactor aman — extract function, rename, simplify kondisi;
          wajib ada test sebelum refactor dimulai.

      - file: "debug-and-fix.yml"
        description: >
          Skill debugging sistematis — reproduce, isolate, identify root cause,
          fix, verify, dan dokumentasikan di lessons-learned.

      - file: "review-code.yml"
        description: >
          Skill code review — checklist arsitektur, keamanan, performa,
          aksesibilitas, dan konvensi tim.

      - file: "migrate-dependency.yml"
        description: >
          Skill migrasi package lama ke baru — audit usage,
          incremental replacement, regression testing.

      - file: "generate-openapi-types.yml"
        description: >
          Skill generate TypeScript types dari
          spesifikasi OpenAPI/Swagger secara otomatis.

      - file: "setup-ci-pipeline.yml"
        description: >
          Skill konfigurasi GitHub Actions untuk lint, typecheck,
          test, build, dan deploy per environment.

      - file: "analyze-performance.yml"
        description: >
          Skill analisis performa — Lighthouse audit (Vista & Mora),
          Profiling Browser, rekomendasi fix terukur.

      - file: "optimize-bundle-size.yml"
        description: >
          Skill analisis dan reduksi bundle — tree shaking audit,
          lazy loading, dynamic import, visualizer report.

      - file: "generate-migration-script.yml"
        description: >
          Skill menulis database/config migration yang idempotent,
          reversible, dengan dry-run mode.

      - file: "setup-monitoring.yml"
        description: >
          Skill setup GlitchTip + PostHog (Vista & Mora) dari nol sampai alert aktif.

      - file: "generate-storybook-story.yml"
        description: >
          Skill membuat Storybook stories untuk semua variant komponen
          dengan controls, args, dan docs page.

      - file: "create-adr.yml"
        description: >
          Skill menulis Architecture Decision Record dengan format
          Context → Decision → Consequences → Alternatives.

      - file: "audit-security.yml"
        description: >
          Skill audit keamanan — OWASP checklist, dependency vulnerabilities,
          secrets scan, auth flow review end-to-end.

      - file: "generate-release-notes.yml"
        description: >
          Skill generate release notes dari commit history —
          kategorisasi feat/fix/breaking, format changelog standar.

      - file: "profile-and-optimize-mora.yml"
        description: >
          Skill profiling Tabler React — identifikasi jank dengan Browser DevTools,
          fix rebuild berlebihan, optimasi PWA.

      - file: "seed-and-mock-data.yml"
        description: >
          Skill membuat realistic seed data dan MSW handlers yang konsisten
          antara dev, test, dan Storybook.

      - file: "incident-postmortem.yml"
        description: >
          Skill menulis postmortem blameless — timeline, root cause,
          impact, action items terukur dengan owner dan due date.

  workflows:
    description: "Alur kerja step-by-step yang mengarahkan agent dari task masuk sampai kode siap merge."
    standard_flow: "0-scoping → 1-research → 2-implement → 3-integrate → 4-verify → 5-commit → 6-deploy → 7-monitor-post-launch"
    files:
      - file: "orchestrator.yml"
        description: >
          Pengatur alur kerja keseluruhan — klasifikasi task, decision rules,
          template handoff, quality gates yang tidak boleh dilewati.

      - file: "0-scoping.yml"
        description: >
          Sebelum research — breakdown epic menjadi task atomic,
          estimasi story point, deteksi dependency antar task.

      - file: "1-research.yml"
        description: >
          Klarifikasi requirement, domain mapping, review API contract,
          design reference, penilaian teknis sebelum menulis kode.

      - file: "2-implement.yml"
        description: >
          Urutan implementasi bottom-up — data layer → state management
          → UI atomic → komposisi → integrasi penuh.

      - file: "3-integrate.yml"
        description: >
          Menghubungkan fitur ke aplikasi — route registration, navigasi,
          cross-feature communication, aksesibilitas.

      - file: "4-verify.yml"
        description: >
          Checklist verifikasi menyeluruh — unit test, component test,
          manual testing multi-browser/device, performa, keamanan.

      - file: "5-commit.yml"
        description: >
          Pre-commit checklist, format Conventional Commits,
          template Pull Request, aturan penamaan branch.

      - file: "6-deploy.yml"
        description: >
          Pipeline deploy — staging checklist, smoke test post-deploy,
          rollback trigger conditions, release tagging.

      - file: "7-monitor-post-launch.yml"
        description: >
          Pantau 24 jam pertama setelah deploy — error rate, performance
          metrics, user feedback, rollback decision tree.

      - file: "8-retrospective.yml"
        description: >
          Setelah fitur live — evaluasi akurasi estimasi, apa yang lambat,
          update lessons-learned.yml. Membuat agent belajar dari setiap siklus.

      - file: "hotfix.yml"
        description: >
          Alur darurat untuk production bug — severity triage,
          bypass normal workflow, komunikasi stakeholder, patch process.

      - file: "e2e-test.yml"
        description: >
          Panduan lengkap menulis E2E test — fixture setup Playwright,
          daftar critical user journey wajib.

      - file: "design-to-code.yml"
        description: >
          Konversi Figma ke kode — ekstrak token, identifikasi komponen
          baru vs reuse, responsive breakpoint mapping.

      - file: "api-contract-first.yml"
        description: >
          API-first development — tulis OpenAPI spec dulu, generate mock,
          parallelkan pengerjaan frontend & backend.

      - file: "dependency-upgrade.yml"
        description: >
          Upgrade dependencies — audit changelog, incremental upgrade,
          regression testing, rollback plan jika gagal.

      - file: "onboarding-new-feature.yml"
        description: >
          Panduan developer baru memahami satu fitur — entry point,
          data flow diagram, contoh test sebagai dokumentasi hidup.

      - file: "performance-audit.yml"
        description: >
          Audit performa berkala — Lighthouse CI, bundle analysis,
          Flutter profiling, prioritisasi dan eksekusi fix.

      - file: "tech-debt-sprint.yml"
        description: >
          Sprint khusus tech debt — inventarisasi, scoring impact × effort,
          batching, larangan campur dengan fitur baru.

  summary:
    total_files:
      entry: 1
      context: 10
      rules: 38
      skills: 27
      workflows: 18
      total: 94
    audit_cycle: "Setiap 2 sprint — hapus rules usang, perbarui yang tidak relevan"
    quality_principle: >
      Kualitas agent ditentukan oleh kejelasan dan konsistensi isi file,
      bukan jumlah file. Jika agent bisa menerima task baru, memilih workflow
      yang tepat, dan menulis kode sesuai arsitektur tanpa ditanya ulang —
      struktur ini sudah cukup.
