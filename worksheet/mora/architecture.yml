meta:
  app: "Mora"
  type: "Progressive Web App (PWA) — Personal Finance"
  url: "https://mora.vistamora.id"
  port_frontend: 3001
  port_api: 4000
  rendering: "App Router + PWA via Serwist"
  users: ["Karyawan", "Personal user (non-karyawan)"]
  pwa_features:
    - "Installable ke home screen Android/iOS"
    - "Offline mode: lihat transaksi & saldo tanpa internet"
    - "Push notification: notif gaji, kasbon, reminder"
    - "Background sync: simpan transaksi saat offline → sync saat online"


request_flow:
  mobile_to_server:
    1: "User buka mora.vistamora.id di HP atau install ke home screen"
    2: "Service Worker (Serwist) intercept request"
    3: "Cache hit → serve dari cache (offline mode)"
    4: "Cache miss → fetch ke Nginx → proxy ke Tabler React :3001"
    5: "Tabler React App Router — page render"
    6: "Client fetch data via React Query ke /api/* → Laravel :4000"


frontend:
  framework: "React + Vite (Tabler Core)"
  React: "^19.0.0"
  architecture: "Clean Feature-Based (Modular)"
  state: "TanStack Query + Context/Zustand"
  ui: "Tabler React (Bootstrap/Sass) CSS Variables"
  domain: "mora.test"
  port: 5173
  https: true (via Laravel Valet)

  pages:
    auth:
      - route: "/login"
        component: "LoginPage"
        type: "Client"
        desc: "Login email/password + Google OAuth — mobile friendly"

      - route: "/register"
        component: "RegisterPage"
        type: "Client"
        desc: "Daftar akun baru — form simple mobile"

      - route: "/onboarding"
        component: "OnboardingPage"
        type: "Client"
        desc: "Setup awal: isi profil, hubungkan dengan workspace perusahaan"

    home:
      - route: "/"
        component: "HomePage"
        type: "Client"
        desc: "Dashboard utama personal finance"
        sections:
          - "Total saldo semua wallet"
          - "Ringkasan bulan ini: pemasukan vs pengeluaran"
          - "Grafik donat pengeluaran per kategori (Recharts RadialBar)"
          - "5 transaksi terakhir"
          - "Goals progress bar aktif"
          - "Streak check-in harian"
          - "AI insight singkat (dari cache Redis)"
        animations:
          - "motion: angka saldo count-up saat load"
          - "motion: goals progress bar fill animation"
          - "canvas-confetti: muncul saat goal tercapai"

    transactions:
      - route: "/transactions"
        component: "TransactionListPage"
        type: "Client"
        desc: "Riwayat transaksi dengan filter & search"
        features:
          - "TanStack Table: virtual scroll 10.000+ transaksi tanpa lag"
          - "Filter: kategori, tanggal, wallet, tipe (income/expense)"
          - "Search by deskripsi atau merchant"
          - "Pull-to-refresh (mobile UX)"
          - "Swipe kiri untuk hapus (vaul bottom sheet konfirmasi)"

      - route: "/transactions/new"
        component: "NewTransactionPage"
        type: "Client"
        desc: "Tambah transaksi manual"
        features:
          - "Form: nominal, kategori, deskripsi, tanggal, wallet"
          - "AI auto-kategorisasi saat user ketik deskripsi (Groq)"
          - "Attach foto nota — buka kamera atau galeri"
          - "Suggest kategori dari riwayat transaksi serupa"

      - route: "/transactions/:id"
        component: "TransactionDetailPage"
        type: "Client"
        desc: "Detail transaksi + foto nota terlampir"
        features:
          - "Tampilkan foto nota hasil scan (pre-signed URL)"
          - "Edit kategori, deskripsi"
          - "Tag ke split bill"

    receipts:
      - route: "/receipts/scan"
        component: "ScanReceiptPage"
        type: "Client"
        desc: "Scan foto nota — kamera atau galeri"
        features:
          - "React-webcam: akses kamera langsung dari browser"
          - "browser-image-compression: compress sebelum upload"
          - "Preview crop area sebelum kirim"
          - "Loading state saat OCR diproses (async Laravel Horizon)"
          - "SSE notif saat OCR selesai → redirect ke konfirmasi"

      - route: "/receipts/:id/confirm"
        component: "ConfirmReceiptPage"
        type: "Client"
        desc: "Konfirmasi & edit hasil OCR sebelum simpan"
        features:
          - "Tampil foto nota bersih hasil scan"
          - "Pre-filled form dari hasil OCR + AI enrichment"
          - "confidence_score rendah → highlight field kuning (perlu dicek)"
          - "confidence_score tinggi → semua ter-fill, tinggal tap Simpan"
          - "Split bill item-based: pilih item per orang"

    wallet:
      - route: "/wallets"
        component: "WalletPage"
        type: "Client"
        desc: "Kelola dompet/rekening"
        features:
          - "List semua wallet: tunai, tabungan, e-wallet"
          - "Saldo per wallet"
          - "Tambah wallet baru"
          - "Transfer antar wallet"

    goals:
      - route: "/goals"
        component: "GoalListPage"
        type: "Client"
        desc: "Goals menabung"
        features:
          - "Card per goal: nama, progress bar, target tanggal"
          - "motion: animasi progress fill"
          - "canvas-confetti: konfeti saat goal 100%"
          - "Filter: aktif, selesai, dijeda"

      - route: "/goals/new"
        component: "NewGoalPage"
        type: "Client"
        desc: "Buat goal baru"
        features:
          - "Pilih emoji, nama, target nominal, target tanggal"
          - "Toggle auto-alokasi: persentase dari setiap gaji masuk"
          - "AI rekomendasi alokasi berdasarkan pengeluaran (Groq)"

      - route: "/goals/:id"
        component: "GoalDetailPage"
        type: "Client"
        desc: "Detail goal: histori setoran, proyeksi capai target"
        features:
          - "Grafik progres bulanan (Recharts Area)"
          - "Tambah setoran manual"
          - "AI narasi: 'Kamu akan capai goal ini pada Maret 2027'"

    budget:
      - route: "/budget"
        component: "BudgetPage"
        type: "Client"
        desc: "Atur anggaran bulanan per kategori"
        features:
          - "Progress bar per kategori: terpakai vs budget"
          - "Alert merah saat 80% budget terpakai"
          - "AI saran alokasi budget berdasarkan pola belanja (Gemini)"
          - "Recharts: Bar chart budget vs realisasi"

    debts:
      - route: "/debts"
        component: "DebtPage"
        type: "Client"
        desc: "Kelola hutang dan piutang"
        features:
          - "List hutang: ke siapa, nominal, jatuh tempo"
          - "List piutang: dari siapa, nominal"
          - "AI rekomendasi urutan pelunasan (Groq — debt snowball/avalanche)"
          - "Reminder via SSE + WA"

    split_bill:
      - route: "/split"
        component: "SplitListPage"
        type: "Client"
        desc: "Daftar grup patungan aktif"
        features:
          - "Card per grup: nama, saldo bersih user saat ini"
          - "Badge: kamu berhutang / kamu punya piutang"
          - "Notif SSE saat ada tagihan baru"

      - route: "/split/groups/:id"
        component: "SplitGroupPage"
        type: "Client"
        desc: "Detail grup patungan"
        features:
          - "List semua tagihan di grup"
          - "Ringkasan: siapa berhutang ke siapa (simplified)"
          - "Bayar tagihan via Tripay QRIS in-app"
          - "History settlement"

      - route: "/split/groups/:id/bills/new"
        component: "NewSplitBillPage"
        type: "Client"
        desc: "Buat tagihan patungan baru"
        features:
          - "Input total atau scan nota"
          - "Pilih mode split: rata, custom, persen, per-item"
          - "Mode per-item: tampilkan item OCR → assign per orang"
          - "Assign anggota"

    ai_advisor:
      - route: "/advisor"
        component: "AdvisorPage"
        type: "Client"
        desc: "AI Financial Advisor chat — Gemini"
        features:
          - "Chat interface seperti WhatsApp"
          - "React-markdown: render response AI dengan formatting"
          - "Konteks: saldo, pengeluaran bulan ini, goals aktif"
          - "Histori percakapan (session)"
          - "Chip saran cepat: 'Analisis pengeluaran', 'Saran menabung'"
          - "Token counter: X / 5 req hari ini (plan free)"

    persona:
      - route: "/persona"
        component: "PersonaPage"
        type: "Client"
        desc: "Spending persona hasil analisis AI"
        features:
          - "Tampilkan persona: 'Penabung Cerdas', 'Impulsif Kreatif', dll"
          - "Tips personal berdasarkan persona"
          - "Share card 1080x1080 via html-to-image"
          - "motion: animasi reveal persona"

    payslip:
      - route: "/payslip"
        component: "PayslipListPage"
        type: "Client"
        desc: "Riwayat slip gaji dari Vista"
        features:
          - "List slip gaji per bulan"
          - "Download PDF"
          - "Breakdown: gaji pokok, tunjangan, potongan, take home"

    kasbon:
      - route: "/kasbon"
        component: "KasbonPage"
        type: "Client"
        desc: "Ajukan kasbon/pinjaman ke perusahaan"
        features:
          - "Form pengajuan: nominal, alasan, cicilan"
          - "Status: pending, disetujui, ditolak"
          - "SSE notif: update status real-time"
          - "Histori kasbon + sisa hutang"

    leave:
      - route: "/leave"
        component: "LeavePage"
        type: "Client"
        desc: "Ajukan cuti / izin"
        features:
          - "Sisa saldo cuti: tahunan, sakit, khusus"
          - "Form pengajuan: tanggal, tipe, alasan"
          - "SSE notif: hasil approve/reject dari Vista"
          - "Kalender cuti"

    attendance:
      - route: "/attendance"
        component: "AttendancePage"
        type: "Client"
        desc: "Check-in / check-out kehadiran"
        features:
          - "Tombol Check In → ambil lokasi GPS browser"
          - "Selfie via React-webcam → upload ke DigitalOcean Storage"
          - "Browser compress sebelum upload (browser-image-compression)"
          - "Emit attendance.checked_in → live map Vista"
          - "Histori kehadiran bulan ini"
          - "Jadwal shift hari ini & minggu depan"

    notifications:
      - route: "/notifications"
        component: "NotificationsPage"
        type: "Client"
        desc: "Riwayat semua notifikasi"
        features:
          - "List notif: gaji, kasbon, cuti, split, AI insight"
          - "Mark as read"
          - "Filter by tipe"

    settings:
      - route: "/settings"
        component: "SettingsPage"
        type: "Client"
        desc: "Pengaturan akun personal"
        tabs:
          - "Profil: foto, nama, telepon"
          - "Keamanan: ganti password, aktifkan 2FA"
          - "Notifikasi: toggle per tipe notif"
          - "Paket: upgrade ke Mora Pro"
          - "Workspace: hubungkan / lepas dari perusahaan"

  layout:
    root_layout:
      file: "app/layout.tsx"
      includes: ["Providers (QueryClient, Theme)", "Toaster (Sonner)", "PostHog", "GlitchTip", "PWA meta tags"]

    app_layout:
      file: "app/(app)/layout.tsx"
      includes:
        bottom_nav:
          type: "Fixed bottom navigation — mobile style"
          items:
            - { label: "Beranda",     icon: "Home",         route: "/" }
            - { label: "Transaksi",   icon: "ArrowLeftRight", route: "/transactions" }
            - { label: "Scan",        icon: "ScanLine",     route: "/receipts/scan", highlight: true }
            - { label: "Goals",       icon: "Target",       route: "/goals" }
            - { label: "Lainnya",     icon: "LayoutGrid",   route: "/more" }
        top_header:
          includes: ["Greeting (Halo, Budi!)", "Notif bell + badge", "Avatar"]

    more_menu:
      route: "/more"
      items:
        - "Advisor AI"
        - "Persona"
        - "Budget"
        - "Hutang & Piutang"
        - "Patungan"
        - "Slip Gaji"
        - "Kasbon"
        - "Cuti & Izin"
        - "Pengaturan"

  pwa:
    package: "@serwist/next"
    version: "^9.0.0"
    manifest:
      name: "Mora — Keuangan Pribadi"
      short_name: "Mora"
      theme_color: "#4F46E5"
      background_color: "#FFFFFF"
      display: "standalone"
      orientation: "portrait"
      icons:
        - { src: "/icon-192.png", sizes: "192x192" }
        - { src: "/icon-512.png", sizes: "512x512" }
        - { src: "/icon-maskable.png", sizes: "512x512", purpose: "maskable" }
    service_worker:
      caching_strategy:
        pages:        "NetworkFirst (fresh data, fallback ke cache)"
        api_GET:      "NetworkFirst TTL 5 menit"
        static_assets: "CacheFirst TTL 30 hari"
        images:       "CacheFirst TTL 7 hari"
      offline_pages:
        - "/ (dashboard dengan data terakhir)"
        - "/transactions (data lokal)"
        - "/goals"
        - "/payslip"
    push_notification:
      via: "Web Push API + VAPID keys"
      events:
        - "Gaji masuk"
        - "Kasbon disetujui/ditolak"
        - "Cuti disetujui/ditolak"
        - "Reminder tagihan patungan"
        - "Goal hampir tercapai"
        - "AI weekly digest"

  state:
    server_state:
      package: "@tanstack/React-query"
      version: "^5.0.0"
      usage:
        - "Cache data transaksi, saldo, goals"
        - "Optimistic updates saat tambah transaksi (langsung muncul, sync di background)"
        - "Infinite scroll transaksi"
        - "Background refetch setiap 2 menit untuk saldo"
      stale_times:
        transactions: 120000   # 2 menit
        wallet:       30000    # 30 detik
        goals:        300000   # 5 menit
        payslip:      3600000  # 1 jam

    client_state:
      package: "zustand"
      version: "^4.5.0"
      stores:
        ui_store:
          fields: ["bottomSheetOpen", "activePage", "scanMode"]
        notification_store:
          fields: ["notifications[]", "unreadCount", "sseConnected"]
        transaction_store:
          fields: ["pendingTransactions[] (offline queue)", "syncStatus"]

  realtime:
    sse:
      client: "native EventSource (0 KB)"
      url: "GET /api/notifications/stream"
      events_received:
        - { event: "payroll.processed",  action: "Toast 'Gaji masuk!' + invalidate wallet + goals" }
        - { event: "kasbon.approved",    action: "Toast notif + update kasbon status" }
        - { event: "kasbon.rejected",    action: "Toast notif + update kasbon status" }
        - { event: "leave.resolved",     action: "Toast notif + update saldo cuti" }
        - { event: "shift.scheduled",    action: "Toast notif + invalidate jadwal shift" }
        - { event: "split.bill_created", action: "Toast + badge split notif +1" }
        - { event: "split.reminder",     action: "Toast reminder bayar patungan" }
        - { event: "receipt.ready",      action: "Redirect ke konfirmasi OCR" }

  animations:
    package: "motion (Framer Motion v11)"
    version: "^11.0.0"
    scope: "Mora only — consumer app butuh feel premium"
    usages:
      - "Saldo count-up animation saat halaman load"
      - "Goal progress bar fill dengan spring animation"
      - "Persona card reveal (fade + scale)"
      - "Streak pop-in (bounce)"
      - "Page transition: slide dari kanan"
      - "Bottom sheet open: slide dari bawah"

    confetti:
      package: "canvas-confetti"
      version: "^1.9.0"
      trigger: "Goal progress mencapai 100%"
      effect: "Konfeti berwarna 3 detik"

  ui_stack:
    component_library: "tabler/ui (copy-paste, zero runtime)"
    styling: "Tailwind CSS v4 — mobile-first"
    icons: "lucide-React"
    theme: "Light/dark mode — next-themes"
    charts: "Recharts (RadialBar untuk donat, Area untuk tren, Bar untuk budget)"
    table: "@tanstack/React-table + @tanstack/React-virtual"
    toast: "sonner"
    drawer: "vaul (bottom sheet — gesture swipe down to dismiss)"
    markdown: "React-markdown + remark-gfm (AI chat response)"

  packages:
    mora_only:
      - { pkg: "@serwist/next",               ver: "^9.0.0",  why: "PWA: offline, installable, push notif" }
      - { pkg: "workbox-strategies",          ver: "^7.0.0" }
      - { pkg: "workbox-routing",             ver: "^7.0.0" }
      - { pkg: "motion",                      ver: "^11.0.0", why: "Micro-interaction consumer app" }
      - { pkg: "canvas-confetti",             ver: "^1.9.0",  why: "Konfeti goal tercapai (3 KB)" }
      - { pkg: "React-webcam",               ver: "^7.2.0",  why: "Selfie presensi + kamera scan nota" }
      - { pkg: "browser-image-compression",  ver: "^2.0.0",  why: "Compress gambar sebelum upload" }
      - { pkg: "html-to-image",              ver: "^1.11.0", why: "Generate share card persona 1080x1080" }
      - { pkg: "React-markdown",             ver: "^9.0.0",  why: "Render AI chat response markdown" }
      - { pkg: "remark-gfm",                 ver: "^4.0.0" }
      - { pkg: "rehype-highlight",           ver: "^7.0.0" }

    shared_with_vista:
      - { pkg: "@tanstack/React-query",   ver: "^5.0.0" }
      - { pkg: "zustand",                 ver: "^4.5.0" }
      - { pkg: "React-hook-form",         ver: "^7.52.0" }
      - { pkg: "@hookform/resolvers",     ver: "^3.0.0" }
      - { pkg: "zod",                     ver: "^3.22.0" }
      - { pkg: "recharts",                ver: "^2.12.0" }
      - { pkg: "@tanstack/React-table",   ver: "^8.17.0" }
      - { pkg: "@tanstack/React-virtual", ver: "^3.0.0" }
      - { pkg: "tailwindcss",             ver: "^4.0.0" }
      - { pkg: "lucide-React",            ver: "^0.400.0" }
      - { pkg: "vaul",                    ver: "^0.9.0" }
      - { pkg: "sonner",                  ver: "^1.5.0" }
      - { pkg: "next-themes",             ver: "^0.3.0" }
      - { pkg: "date-fns",                ver: "^3.6.0" }
      - { pkg: "date-fns-tz",             ver: "^3.1.0" }


backend_modules_used:

  auth_module:
    endpoints:
      - "POST /api/auth/login"
      - "POST /api/auth/register"
      - "GET  /api/auth/google"
      - "POST /api/auth/refresh"
      - "POST /api/auth/logout"
      - "POST /api/auth/verify-otp"

  profile_module:
    endpoints:
      - "GET   /api/profile"
      - "PATCH /api/profile"
      - "POST  /api/profile/avatar"
    notes: "Upload selfie via @Laravel Router/multipart → sharp compress → DigitalOcean Storage"

  transaction_module:
    endpoints:
      - "GET    /api/transactions"
      - "POST   /api/transactions"
      - "GET    /api/transactions/:id"
      - "PATCH  /api/transactions/:id"
      - "DELETE /api/transactions/:id"
      - "GET    /api/transactions/summary"
    notes: "POST auto-kategorisasi via Groq (cache Redis 30 hari)"

  receipt_module:
    endpoints:
      - "POST /api/receipts/scan"
      - "GET  /api/receipts/:id"
      - "POST /api/receipts/:id/confirm"
      - "GET  /api/receipts/:id/items"
    notes: "OCR async Laravel Horizon. SSE notif saat siap."

  wallet_module:
    endpoints:
      - "GET    /api/wallets"
      - "POST   /api/wallets"
      - "PATCH  /api/wallets/:id"
      - "DELETE /api/wallets/:id"
      - "POST   /api/wallets/transfer"

  goal_module:
    endpoints:
      - "GET    /api/goals"
      - "POST   /api/goals"
      - "GET    /api/goals/:id"
      - "PATCH  /api/goals/:id"
      - "POST   /api/goals/:id/deposit"
    notes: "deposit → update current_amount → cek 100% → emit event konfeti"

  budget_module:
    endpoints:
      - "GET   /api/budgets"
      - "POST  /api/budgets"
      - "PATCH /api/budgets/:id"
      - "GET   /api/budgets/vs-actual"

  debt_module:
    endpoints:
      - "GET    /api/debts"
      - "POST   /api/debts"
      - "PATCH  /api/debts/:id"
      - "POST   /api/debts/:id/payments"

  split_module:
    endpoints:
      - "GET    /api/split/groups"
      - "POST   /api/split/groups"
      - "GET    /api/split/groups/:id"
      - "POST   /api/split/groups/:id/members"
      - "POST   /api/split/groups/:id/bills"
      - "GET    /api/split/bills/:id"
      - "POST   /api/split/bills/:id/pay"
      - "GET    /api/split/groups/:id/balance"

  ai_module:
    endpoints:
      - "POST /api/ai/chat"
      - "POST /api/ai/categorize"
      - "GET  /api/ai/persona"
      - "GET  /api/ai/forecast"
      - "GET  /api/ai/budget-suggestion"
      - "GET  /api/ai/debt-recommendation"
    middleware: ["auth:sanctum", "AiTokenGuard"]
    interceptors: ["AiCacheInterceptor"]
    limits_per_plan:
      mora_free: "5 req/hari"
      mora_pro:  "50 req/hari"

  payslip_module:
    endpoints:
      - "GET /api/payslip"
      - "GET /api/payslip/:id"
      - "GET /api/payslip/:id/pdf"
    notes: "Data dari Vista via bridge event payroll.processed"

  kasbon_module:
    endpoints:
      - "GET  /api/kasbon"
      - "POST /api/kasbon"
      - "GET  /api/kasbon/:id"
    notes: "Pengajuan kasbon → notif Vista HR via EventEmitter"

  leave_module:
    endpoints:
      - "GET  /api/leave/balance"
      - "GET  /api/leave/requests"
      - "POST /api/leave/requests"
      - "GET  /api/leave/requests/:id"
    notes: "Pengajuan → notif Vista HR. Hasil → SSE ke Mora."

  attendance_module:
    endpoints:
      - "GET  /api/attendance"
      - "POST /api/attendance/checkin"
      - "POST /api/attendance/checkout"
      - "GET  /api/attendance/shifts"
    notes: "Check-in kirim GPS + selfie. Emit attendance.checked_in → live map Vista."

  notification_module:
    endpoints:
      - "GET   /api/notifications/stream (SSE)"
      - "GET   /api/notifications"
      - "PATCH /api/notifications/:id/read"
      - "POST  /api/notifications/push-subscribe"
    notes: "Subscribe Web Push VAPID untuk notif saat app di-background"


middleware:
  global:
    - name: "auth:sanctum"
      desc: "Semua route /(app)/* dilindungi Sanctum"
      skip: ["/login", "/register", "/onboarding", "/api/auth/*"]

    - name: "AiTokenGuard"
      desc: "Batasi AI request per plan per hari"
      applies_to: "/api/ai/*"
      limits:
        mora_free: 5
        mora_pro:  50

    - name: "AiCacheInterceptor"
      desc: "Cache AI response Redis → hemat token drastis"
      ttl:
        kategorisasi:   "30 hari (merchant sama → kategori sama)"
        persona:        "30 hari"
        forecast:       "1 jam"
        budget_suggest: "1 hari"

    - name: "LoggingInterceptor"
      desc: "Log semua request dengan pino"

    - name: "TransformInterceptor"
      desc: "Wrap response dalam { success, data, timestamp }"

  rate_limiting:
    login:   { max: 5,  window: "15 menit" }
    checkin: { max: 5,  window: "1 jam",    reason: "Cegah spam check-in" }
    scan:    { max: 20, window: "1 jam",    reason: "Cegah abuse OCR" }


database_tables:
  primary:
    - users
    - profiles
    - sessions
    - wallets
    - transactions
    - categories
    - budgets
    - goals
    - goal_pockets
    - goal_allocations
    - debts
    - debt_payments
    - receipts
    - receipt_items
    - split_groups
    - split_members
    - split_bills
    - split_bill_items
    - split_assignments
    - notifications
    - subscriptions
    - ai_usage_logs

  read_from_vista_context:
    - employees        # data karyawan (nama, posisi) untuk profil Mora
    - payroll_items    # slip gaji masuk dari Vista
    - kasbon_requests  # status kasbon
    - leave_requests   # status cuti
    - shifts           # jadwal kerja


events:
  emitted_by_mora:
    - event: "leave.submitted"
      trigger: "Karyawan submit pengajuan cuti"
      received_by: "Vista — notif HR"

    - event: "kasbon.requested"
      trigger: "Karyawan ajukan kasbon"
      received_by: "Vista — notif HR"

    - event: "attendance.checked_in"
      trigger: "Karyawan check-in dengan GPS + selfie"
      received_by: "Vista — update live map presensi"

    - event: "split.paid"
      trigger: "User tandai tagihan patungan lunas"
      received_by: "TransactionService — catat transaksi otomatis kedua pihak"

    - event: "receipt.confirmed"
      trigger: "User konfirmasi hasil OCR nota"
      received_by: "TransactionService — buat transaksi + attach nota"

  received_by_mora:
    - event: "payroll.processed"
      from: "Vista"
      actions:
        - "Catat income ke wallet karyawan"
        - "Hitung alokasi otomatis ke goals aktif"
        - "Push notif: 'Gaji Rp X,xxx,xxx sudah masuk!'"
        - "SSE stream ke Mora client"

    - event: "kasbon.approved"
      from: "Vista"
      actions:
        - "Update status kasbon: disetujui"
        - "Catat hutang ke debts table"
        - "SSE + push notif ke karyawan"

    - event: "kasbon.rejected"
      from: "Vista"
      actions:
        - "Update status kasbon: ditolak"
        - "SSE + push notif ke karyawan"

    - event: "leave.resolved"
      from: "Vista"
      actions:
        - "Update saldo cuti"
        - "SSE + push notif ke karyawan"

    - event: "shift.scheduled"
      from: "Vista"
      actions:
        - "Update jadwal shift user"
        - "SSE notif: 'Jadwal shift kamu diupdate'"


Laravel Horizon_jobs:
  receipt_ocr_queue:
    concurrency: 5
    jobs:
      process_receipt:
        trigger: "POST /api/receipts/scan"
        steps:
          - "Load foto via sharp → grayscale + adaptive threshold + denoise"
          - "OpenCV: deteksi 4 sudut nota (contour detection)"
          - "Perspective warp → dokumen lurus seperti scanner"
          - "Upload gambar bersih ke Cloudflare R2"
          - "tesseract.js: OCR ekstrak merchant, items[], total"
          - "Groq: koreksi typo OCR + kategorisasi merchant (cache 30 hari)"
          - "Simpan Receipt draft ke DB"
          - "Hapus foto mentah dari storage"
          - "Emit SSE: receipt.ready → redirect user ke konfirmasi"

  split_notif_queue:
    concurrency: 10
    jobs:
      send_split_reminder:
        trigger: "Cron H+1, H+3, H+7 dari tanggal split bill"
        steps:
          - "Cek SplitAssignment belum is_paid"
          - "Kirim SSE notif + push notif"
          - "Jika nomor WA tersedia → kirim WA via Meta API"

  ai_batch_queue:
    concurrency: 3
    jobs:
      monthly_insight:
        trigger: "Cron 02:30 setiap hari (Ollama)"
        steps:
          - "Ambil semua user aktif"
          - "Per user: ringkas transaksi bulan lalu"
          - "Kirim ke Ollama qwen2.5:7b"
          - "Simpan ke Redis TTL 1 hari"

      weekly_digest:
        trigger: "Cron Senin 07:00 (Ollama)"
        steps:
          - "Generate ringkasan minggu lalu per user"
          - "Push notif + SSE: 'Digest minggu ini sudah siap'"

  bridge_queue:
    concurrency: 10
    jobs:
      sync_vista_mora:
        trigger: "Event dari Vista (payroll.processed, kasbon.approved, etc)"
        steps:
          - "Proses event payload"
          - "Update data Mora (wallet, kasbon, goals, cuti)"
          - "Kirim SSE + push notif ke user terkait"


scheduler:
  jobs:
    - cron: "30 2 * * *"
      job: "Ollama: generate monthly insight semua user aktif"

    - cron: "0 7 * * 1"
      job: "Ollama: weekly digest → push notif Mora"

    - cron: "30 0 * * *"
      job: "Ollama: update cash flow forecast 30/60/90 hari"

    - cron: "0 20 * * *"
      job: "Daily reminder: input transaksi hari ini via SSE + push"

    - cron: "0 9 * * *"
      job: "Reminder tagihan patungan jatuh tempo (H+1, H+3, H+7)"

    - cron: "0 3 * * *"
      job: "Cleanup foto nota mentah belum diproses > 24 jam"

    - cron: "0 0 * * *"
      job: "Reset AI token bucket (Redis TTL handle otomatis)"


ai_features:

  kategorisasi_transaksi:
    trigger: "Saat user input transaksi manual atau OCR nota"
    provider: "Groq (real-time, <0.5 detik)"
    cache: "Redis 30 hari — merchant sama selalu sama kategori"
    output: "{ category: 'Belanja', confidence: 0.95 }"
    token_cost: "0 jika cache hit (70-80% hit rate)"

  ai_chat_advisor:
    trigger: "User buka halaman /advisor"
    provider: "Gemini (context panjang 1 juta token)"
    context_injected:
      - "Saldo semua wallet"
      - "Pengeluaran bulan ini per kategori"
      - "Goals aktif + progress"
      - "Top 10 transaksi terakhir"
    token_guard: "AiTokenGuard — 5 req/hari (free), 50 req/hari (pro)"

  spending_persona:
    trigger: "User buka /persona atau update bulanan (cron)"
    provider: "Gemini"
    cache: "Redis 30 hari per user"
    personas:
      - "Penabung Cerdas"
      - "Konsumen Impulsif"
      - "Foodie Enthusiast"
      - "Tech Geek"
      - "Traveler Aktif"
      - "Minimalis Bijak"
    output: "{ persona, description, tips[], share_card_data }"

  cash_flow_forecast:
    trigger: "Cron 00:30 harian (Ollama) + cache"
    provider: "Ollama qwen2.5:7b (batch, gratis unlimited)"
    cache: "Redis 1 jam"
    output: "{ forecast_30d, forecast_60d, forecast_90d, narrative }"

  budget_suggestion:
    trigger: "User buka /budget pertama kali atau minta saran AI"
    provider: "Gemini"
    cache: "Redis 1 hari"
    output: "{ suggestions: [{ category, recommended_amount, reason }] }"

  debt_recommendation:
    trigger: "User buka /debts → tab Rekomendasi"
    provider: "Groq"
    cache: "Redis 1 hari"
    output: "{ strategy: 'avalanche', order: [], estimated_debt_free_date }"

  ocr_enrichment:
    trigger: "Setelah tesseract.js OCR selesai"
    provider: "Groq"
    cache: "Redis 30 hari per merchant hash"
    output: "{ merchant_corrected, category, items_corrected[], confidence_score }"


monitoring:
  error_tracking:
    service: "GlitchTip self-hosted"
    package: "@sentry/nextjs"
    dsn: "${GLITCHTIP_DSN}"

  analytics:
    service: "PostHog Cloud"
    package: "posthog-js"
    events_tracked:
      - "pageview semua halaman"
      - "transaction_added"
      - "receipt_scanned"
      - "goal_created"
      - "goal_completed (+ confetti triggered)"
      - "ai_chat_sent"
      - "split_bill_created"
      - "pwa_installed"
      - "push_notification_clicked"
      - "feature_used (scan, advisor, persona)"

  DigitalOcean:
    - "DigitalOcean Monitoring: container Mora CPU/RAM"
    - "DigitalOcean Logging: Tabler React + service worker logs"


environment_variables:
  NEXT_PUBLIC_API_URL: "http://vistamora.test"
  NEXT_PUBLIC_WS_URL: "ws://vistamora.test"
  NEXT_PUBLIC_POSTHOG_KEY: "<from-posthog.com>"
  NEXT_PUBLIC_POSTHOG_HOST: "https://app.posthog.com"
  NEXT_PUBLIC_SENTRY_DSN: "${GLITCHTIP_DSN}"
  NEXT_PUBLIC_APP_NAME: "Mora"
  NEXT_PUBLIC_VISTA_URL: "https://vista.vistamora.id"
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: "<VAPID public key untuk Web Push>"


docker:
  dockerfile: "apps/mora/Dockerfile"
  strategy: "Multi-stage build"
  stages:
    deps:
      base: "node:20-alpine"
      runs: "npm install --frozen-lockfile"
    builder:
      base: "node:20-alpine"
      runs: "npm turbo build --filter=mora"
      output: ".next/standalone"
    runner:
      base: "node:20-alpine"
      arch: "linux/arm64 (VPS Server)"
      copies: ".next/standalone, .next/static, public"
      cmd: "node server.js"
  final_image_size: "~120 MB"
  port: 3001
  healthcheck: "GET /api/health → HTTP 200"