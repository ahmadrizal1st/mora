mora:
  meta:
    name: "Mora"
    type: "Mobile PWA (Personal Finance)"
    framework: "Tabler React + Serwist (PWA)"
    styling: "Tailwind CSS + Tabler UI (Mobile Optimized)"
  
  pages:
    dashboard:
      - path: /
        components: [BalanceCard, BudgetProgressRing, GoalHighlightCard, TransactionFeed]
        apis: [GET /wallets, GET /transactions?limit=5, GET /budgets?month=current]
    
    transactions:
      - path: /transactions/new
        components: [AmountKeypad, CategoryPicker, WalletSelector, DateScroller]
        apis: [GET /categories, POST /transactions]
      - path: /scan
        components: [FullCameraUI, ScanGuide, ProcessingOverlay]
        apis: [POST /receipts/scan]
        features: [OCR: Tesseract WASM, AI: Auto-categorization]
      - path: /scan/review/:id
        components: [CleanImagePreview, ResultForm, ItemCorrectionList]
        apis: [GET /receipts/:id, POST /receipts/:id/confirm]
    
    tools:
      goals:
        - path: /goals/:id
          components: [ProgressRing, PocketList, AllocateMoneyModal]
          apis: [GET /goals/:id, POST /goals/:id/allocate]
          features: [AI: Smart allocation recommendation]
      split_bill:
        - path: /split/:group_id
          components: [GroupHeader, BillList, MemberCircles, SettlementSummary]
          apis: [GET /split/groups/:id, GET /split/groups/:id/settlement]
          features: [Algorithm: Debt Simplification]
    
    ai_advisor:
      - path: /ai/chat
        desc: "AI Financial Consultant"
        components: [MessageList, ChatInputWithVoice, TokenUsageIndicator]
        apis: [POST /ai/chat]
        features: [AI: Gemini 2.0 Streaming, Context: User finances]

    account:
      - path: /settings
        components: [MenuLinkList, ProfileSummary, PwaInstallButton]
        apis: [GET /auth/me, PATCH /auth/me]
      - path: /notifications
        components: [NotificationList, FilterTabs]
        apis: [GET /notifications, PATCH /notifications/:id/read]
        features: [SSE: Real-time update stream]
